{"idx": 3, "score": 0.75, "parents": "0", "role": "", "components": {"perception": "import json\nimport ast\nfrom collections import Counter\nfrom typing import List, Tuple, Optional\n\n# Colour palette for integer grids (0-11 mapping)\nINT_PALETTE = {\n    0: \"black\", 1: \"blue\", 2: \"red\", 3: \"green\", 4: \"yellow\",\n    5: \"light-gray\", 6: \"magenta\", 7: \"orange\", 8: \"light-blue\",\n    9: \"maroon\", 10: \"white\", 11: \"dark-gray\"\n}\n\ndef _parse_string_grid(obs: str) -> Optional[List[List[str]]]:\n    \"\"\"Try to parse the observation as a JSON array of colour names.\"\"\"\n    start = obs.find(\"[[\")\n    end = obs.rfind(\"]]\")\n    if start == -1 or end == -1:\n        return None\n    try:\n        grid = json.loads(obs[start:end+2])\n        if isinstance(grid, list) and len(grid) > 0 and isinstance(grid[0], list):\n            # Ensure it's a list of lists of strings\n            if all(isinstance(row, list) and all(isinstance(cell, str) for cell in row) for row in grid):\n                return grid\n    except (json.JSONDecodeError, ValueError):\n        pass\n    return None\n\ndef _parse_integer_grid(obs: str) -> Optional[List[List[str]]]:\n    \"\"\"Try to parse the observation as an ARC integer grid.\"\"\"\n    # Find the marker line like \"<grid_0>\"\n    marker_pos = obs.find(\"<grid_\")\n    if marker_pos == -1:\n        return None\n    # Move to the next line after the marker\n    line_start = obs.find(\"\\n\", marker_pos)\n    if line_start == -1:\n        return None\n    # Collect lines that look like bracketed integer lists\n    rows = []\n    for line in obs[line_start+1:].split(\"\\n\"):\n        line = line.strip()\n        if not line.startswith(\"[\"):\n            break\n        try:\n            row = ast.literal_eval(line)\n            if isinstance(row, list) and all(isinstance(x, int) for x in row):\n                # Convert integers to colour names\n                rows.append([INT_PALETTE.get(x, \"gray\") for x d(key_lines)\n\n    return \"\\n\".join(parts)\n\ndef perceive(observation_history: List[str]) -> str:\n    \"\"\"\n    Produce a concise textual summary of decision-relevant features from the\n    last raw observation.\n    The output only contains raw state variables (non-background cells, blue block length,\n    key cell colours) \u2013 no effect predictions \u2013 so that any change in the world\n    is reflected in the feature string.\n    \"\"\"\n    obs = observation_history[-1]\n\n    # Try both grid formats\n    grid = _parse_string_grid(obs) or _parse_integer_grid(obs)\n    if grid is None:\n        # Fallback: return a meaningful string (never raise, never empty)\n        return \"parse_error: grid format not recognized\"\n\n    try:\n        result = _summarize_grid(grid)\n        if not result:\n            return \"empty_state\"\n        return result\n    except Exception:\n        # Never raise, return a best-effort summary\n        return \"perception_error: internal failure\"\n\nif __name__ == \"__main__\":\n    # Simple test (can be omitted)\n    pass", "world_knowledge": "world knowledge\n- Click cell (3,3) changes its color and adjusts the contiguous blue block in row 0:\n  - If (3,3) is brown: becomes lightblue; set blue block length to 2 (cells (0,0) and (0,1) blue, rest of row 0 white).\n  - If (3,3) is sandybrown: becomes lightblue; extend blue block right by one (add blue at next column after current block).\n  - If (3,3) is lightblue: remains lightblue; remove the rightmost blue cell from the block (if any).\n- Click cell (4,3) toggles its color between white and orange, except when (4,3) is white and (5,3) is white \u2192 no effect.\n- Click cell (6,0) sets (5,3) to yellow if it is white; otherwise no effect.\n- All other clicks and movement actions cause no change. Actions are valid even if they produce no effect."}},

       break\n    if rows:\n        return rows\n    return None\n\n\ndef _parse_grid(obs: str) -> Optional[List[List[str]]]:\n    \"\"\"Return the grid as a list of list of colour names, or None.\"\"\"\n    return _parse_string_grid(obs) or _parse_integer_grid(obs)\n\n\ndef _get_background(grid: List[List[str]]) -> str:\n    \"\"\"Most frequent colour in the grid (background).\"\"\"\n    flat = [cell for row in grid for cell in row]\n    if not flat:\n        return \"black\"\n    return Counter(flat).most_common(1)[0][0]\n\n\ndef _grid_equal(g1: List[List[str]], g2: List[List[str]]) -> bool:\n    \"\"\"Check if two parsed grids are identical.\"\"\"\n    if len(g1) != len(g2):\n        return False\n    for r in range(len(g1)):\n        if g1[r] != g2[r]:\n            return False\n    return True\n\n\ndef _count_stable_steps(history: List[str], current_grid: List[List[str]]) -> int:\n    \"\"\"Number of consecutive observations (including current) that have the same grid.\"\"\"\n    count = 1\n    # parse backwards from the second\u2011last observation\n    for raw in reversed(history[:-1]):\n        prev = _parse_grid(raw)\n        if prev is not None and _grid_equal(prev, current_grid):\n            count += 1\n        else:\n            break\n    return count\n\n\n# ----------------------------------------------------------------------\n# feature extraction\n# ----------------------------------------------------------------------\n\ndef _extract_blue_block(grid: List[List[str]]) -> Optional[str]:\n    \"\"\"If row 0 contains a contiguous blue block, return a compact representation.\"\"\"\n    if not grid:\n        return None\n    row0 = grid[0]\n    start = None\n    end = None\n    for i, colour in enumerate(row0):\n        if colour == \"blue\":\n            if start is None:\n                start = i\n            end = i\n        else:\n            if start is not None:\n                # only one block expected; break after first gap\n                break\n    if start is not None:\n        return f\"blue_block: row 0 cols {start}-{end}\"\n    return None\n\n\ndef _extract_white_vertical_pairs(grid: List[List[str]]) -> List[str]:\n    \"\"\"Return lines describing contiguous white cells in the same column, length >=2.\"\"\"\n    rows = len(grid)\n    if rows == 0:\n        return []\n    cols = len(grid[0])\n    lines = []\n    for c in range(cols):\n        r = 0\n        while r < rows:\n            if grid[r][c] == \"white\":\n                start = r\n                while r < rows and grid[r][c] == \"white\":\n                    r += 1\n                length = r - start\n                if length >= 2:\n                    lines.append(f\"white_vertical_pair: col {c} rows {start}-{r-1}\")\n            else:\n                r += 1\n    return lines\n\n\ndef perceive(observation_history: List[str]) -> str:\n    \"\"\"\n    Produce a concise textual summary of decision\u2011relevant features.\n    The output always contains at least one line and never raises.\n    \"\"\"\n    obs = observation_history[-1]\n    grid = _parse_grid(obs)\n    if grid is None:\n        # fallback: return something meaningful\n        return \"parse_error: grid unreadable\"\n\n    bg = _get_background(grid)\n\n    # ---- features that change when the world moves ----\n\n    lines = []\n\n    # 1. aggregated blue block (if any)\n    blue = _extract_blue_block(grid)\n    if blue:\n        lines.append(blue)\n\n    # 2. list non\u2011background, non\u2011white cells\n    for r, row in enumerate(grid):\n        for c, colour in enumerate(row):\n            if colour != bg and colour != \"white\":\n                lines.append(f\"cell {r} {c}: {colour}\")\n\n    # 3. white vertical pairs (relevant for click conditions)\n    pairs = _extract_white_vertical_pairs(grid)\n    lines.extend(pairs)\n\n    # 4. stable steps count (helps distinguish noop from conditional click)\n    stable = _count_stable_steps(observation_history, grid)\n    lines.append(f\"stable_count: {stable}\")\n\n    # ensure non\u2011empty\n    return \"\\n\".join(lines)", "world_knowledge": "world knowledge\n- State features list only non-white cells; white cells are the default background and are omitted.\n- There is a blue block in row 0: a contiguous set of blue cells starting at column 0. Its length determines which cells are blue. Only the blue cells are listed.\n- Click (3,3) affects both its own color and the blue block:\n  - If (3,3) is brown \u2192 becomes lightblue, and the blue block length is set to 2 (cells (0,0) and (0,1) become blue; any other blue cells in row 0 become white).\n  - If (3,3) is sandybrown \u2192 becomes lightblue, and the blue block extends right by one (the next column after the current block becomes blue, increasing block length by 1).\n  - If (3,3) is lightblue \u2192 stays lightblue, and the rightmost blue cell in row 0 is removed (if any; if block length becomes 0, no blue cells remain).\n- Click (4,3) toggles its color between white and orange, except: when (4,3) is white and (5,3) is also white, the click has no effect. If (4,3) is orange, it always becomes white (the exception only applies when trying to turn white\u2192orange and (5,3) is white).\n- Click (6,0): if (5,3) is white, it becomes yellow; otherwise no effect.\n- After any click that changes cell (4,3) or (5,3), the derived feature \"white_vertical_pair\" must be recalculated: if both (4,3) and (5,3) are white, add 'white_vertical_pair: col 3 rows 4-5'; otherwise omit it. This applies to clicks that change those cells (e.g., click (4,3) making (4,3) white, click (6,0) making (5,3) yellow). Clicks that do not affect (4,3) or (5,3) leave the derived feature unchanged.\n- All other clicks (including cells with no defined rule, e.g., pink (3,3)) and movement actions cause no change. Actions are valid even if they produce no effect.\n- For inverse dynamics: when the state is unchanged, the most likely hidden action is noop. However, if the trajectory contains a history of deliberate clicks (e.g., a prior click (3,3) or (4,3) within the observable window) and the hidden action is a conditional click that would do nothing (e.g., click (4,3) when both white, click (6,0) when (5,3) already yellow, or any click with no rule), such an action becomes plausible as a deliberate test and should be considered over noop. This does not apply if the only prior clicks are far in the past and separated by many noops; the plausibility increases with recent deliberate actions or a pattern of attempting conditional clicks."}},

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
