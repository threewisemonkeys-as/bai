ow (row15) at odd columns (1,3,5,7,9,11,13,15). They never change.\n\n- There are two moveable blocks in rows 0\u20132: a gold block (typically 3x3 or 3x1) and a gray block (typically 3x4). They do not overlap.\n  - The gold block is moved right one column by the 'click' action (coordinates irrelevant). If it would go out of bounds, the click is blocked.\n  - The gray block is moved left or right one column by the 'left' or 'right' action. It cannot move up/down. If it would go out of bounds, the movement is blocked.\n  - In some states the gold block may be absent (replaced by gray or disappeared); then click has no effect.\n\n- Blue cells:\n  - Spawn periodically at row 3. The spawn column is 13 if a gold block is present in the grid, otherwise 3. The exact spawn interval is fixed but not specified here.\n  - Every timestep (after the action effect), all blue cells automatically fall one row downward. If a blue cell would land on a non\u2011background cell (including green, mediumpurple, gold, gray, or another blue), it disappears instead of moving there. If it would fall below row 15, it disappears.\n\n- Action blocking:\n  - A movement action (up/down/left/right) that cannot be executed (due to grid boundary or obstacle) results in **no state change at all**: the attempted movement does not occur, and the automatic blue fall is also suppressed for that timestep.\n  - A 'click' that would move the gold block out of bounds is also blocked, with the same total suppression.\n  - A 'noop' action never blocks; blue fall always occurs (and any regular spawn happens).\n\n- Forward dynamics (state transition):\n  Given current state and action:\n  1. If the action is a movement or click that is blocked \u2192 next state = current state.\n  2. Otherwise:\n     - Apply the action effect: left/right shifts gray block; click shifts gold block right; noop leaves both unchanged.\n     - Then apply automatic blue fall: move each blue cell down one row (with disappearance on occupied cells).\n     - If the current step is a spawn step (determined by the fixed interval), add a new blue cell at the spawn location (row3, column as above) after the fall. (The new blue does not fall on the same step it appears.)\n\n- Colors: gold, gray, blue, mediumpurple, green. Green is static; mediumpurple appears at (12,13) and is static obstacle."}},

onents}\n    rules = set()\n    if 'gray' in colours_present:\n        rules.add(\"gray:h_move\")\n    if 'gold' in colours_present:\n        rules.add(\"gold:click_right\")\n    if 'blue' in colours_present:\n        rules.add(\"blue:auto_down\")\n    if 'green' in colours_present:\n        rules.add(\"green:wall\")\n    if 'gray' in colours_present and 'gold' in colours_present:\n        rules.add(\"gray_overwrites_gold\")\n    if rules:\n        parts.append(\"rules:\" + \" \".join(sorted(rules)))\n\n    # All components (except player, which is already listed) with their property\n    comp_parts = [\"comps:\"]\n    for col, r1, c1, r2, c2, cnt in components:\n        if player_comp and col == player_comp[0] and (r1, c1) == (player_comp[1], player_comp[2]) and (r2, c2) == (player_comp[3], player_comp[4]):\n            continue\n        prop = colour_props.get(col, 'static')\n        if r1 == r2 and c1 == c2:\n            comp_parts.append(f\"{col}:{prop}@({r1},{c1})\")\n        else:\n            comp_parts.append(f\"{col}:{prop}[{r1},{c1}->{r2},{c2}]\")\n    if len(comp_parts) > 1:\n        parts.append(\" \".join(comp_parts))\n\n    out = \" | \".join(parts)\n    if not out:\n        out = f\"step:{step} all_black\"\n    return out[:2000]\n\n\ndef _extract_metadata(obs: str):\n    \"\"\"Extract step number and action count from the observation header.\"\"\"\n    meta = {}\n    lines = obs.splitlines()\n    for line in lines:\n        line = line.strip()\n        m = re.match(r'^Step:\\s*(\\d+)', line, re.IGNORECASE)\n        if m:\n            meta['step'] = int(m.group(1))\n        m = re.match(r'^Action count:\\s*(\\d+)', line, re.IGNORECASE)\n        if m:\n            meta['action_count'] = int(m.group(1))\n    return meta\n\n\ndef _parse_grid(obs: str):\n    \"\"\"Return 2D list (list of lists) of ints or colour strings.\"\"\"\n    # Try Autumn JSON first (starts with [[)\n    if '[[' in obs:\n        start = obs.find('[[')\n        end = obs.rfind(']]') + {"idx": 6, "score": 0.85, "parents": "3", "role": "", "components": {"perception": "import json\nimport re\nimport ast\nfrom collections import Counter\n\ndef perceive(observation_history: list[str]) -> str:\n    \"\"\"\n    Parse the raw observation (last element of observation_history) and return\n    a concise text summary of decision-relevant features (grid size and all\n    non-background cells). The output changes when the world changes, allowing\n    consecutive states to be compared to recover the action taken.\n    Handles both ARC integer grids and Autumn string (JSON) grids.\n    Never raises, never returns an empty string.\n    \"\"\"\n    # Use the most recent observation\n    obs = observation_history[-1] if observation_history else \"\"\n    try:\n        # --------------------------------------------------------------\n        # 1. Detect grid encoding and parse it into a 2D list 'grid'\n        # --------------------------------------------------------------\n        if '[[' in obs:\n            # Autumn string grid \u2013 embedded JSON array of colour names\n            start = obs.find('[[')\n            # Find the matching closing ']]'\n            end = obs.rfind(']]') + 2\n            if end <= start:\n                raise ValueError(\"Could not locate grid boundaries\")\n            grid_str = obs[start:end]\n            grid = json.loads(grid_str)          # list of lists of strings\n        else:\n            # ARC integer grid \u2013 lines like \"[14, 14, ...]\" after <grid_0>\n            lines = obs.splitlines()\n            grid_lines = []\n            in_grid = False\n            for line in lines:\n                if '<grid_' in line:\n                    in_grid = True\n                    continue\n                if in_grid:\n                    # Stop if we hit another <grid_k> marker\n                    if line.strip().startswith('<grid_'):\n                        break\n                    # Collect lines that are actual row arrays\n                    if line.strip().startswith('['):\n                        grid_lines.append(line.strip())\n            if not grid_lines:\n                raise ValueError(\"No grid lines found\")\n            # Convert each text row into a Python list of integers\n            grid = [ast.literal_eval(line) for line in grid_lines]\n\n        if not grid or not grid[0]:\n            raise ValueError(\"Empty grid\")\n\n        # Dimensions\n        rows = len(grid)\n        cols = len(grid[0])\n\n        # --------------------------------------------------------------\n        # 2. Determine the background colour (most frequent cell)\n        # --------------------------------------------------------------\n        flat = [cell for row in grid for cell in row]\n        bg = Counter(flat).most_common(1)[0][0]\n\n        # --------------------------------------------------------------\n        # 3. Collect all non\u2011background cells\n        # --------------------------------------------------------------\n        non_bg = []\n        for r, row in enumerate(grid):\n            for c, cell in enumerate(row):\n                if cell != bg:\n                    non_bg.append((r, c, cell))\n\n        # --------------------------------------------------------------\n        # 4. Build output string (<2000 characters)\n        # --------------------------------------------------------------\n        if not non_bg:\n            return f\"grid {rows}x{cols}; all background ({bg})\"\n\n        cells_str = \"; \".join(f\"r{r}c{c}:{color}\" for r, c, color in non_bg)\n        if len(cells_str) > 1800:          # leave room for the prefix\n            cells_str = cells_str[:1797] + \"...\"\n        return f\"grid {rows}x{cols}; non_background: {cells_str}\"\n\n    except Exception as e:\n        # Fallback \u2013 never raise, never return empty\n        return f\"perception_parse_error: {e}\"", "world_knowledge": "- Grid: 16x16. Static green cells occupy bottom row (row15) at odd columns (1,3,5,7,9,11,13,15). Static mediumpurple cell at (12,13). Both never change.\n\n- Two moveable blocks in rows 0\u20132: gold (typically 3x3 or 3x1) and gray (typically 3x4). They do not overlap initially, but movement can cause overlap.\n  - Gray block moves left/right by one column via the **left** or **right** action. It cannot move up/down. If it would go out of bounds or any target cell is occupied by a non\u2011background cell that is **not** gold (i.e., green, mediumpurple, blue), the movement is blocked. Target cells that are gold cells are **not** blocking \u2013 they are removed (gold block shrinks) and the gray occupies them.  \n  - Gold block moves right by one column via the **click** action (coordinates irrelevant). The same blocking rules apply: out\u2011of\u2011bounds or target cells occupied by non\u2011background cells that are **not** gray block the click. Overlapping gray cells are removed (gray block shrinks). If no gold block exists in the grid, click has no effect (not blocked, but does nothing).\n\n- Blue cells:\n  - Spawn periodically (fixed interval, not every step) at row 3. The spawn column is 13 if any gold cell is present in the grid, else 3. Spawn occurs **after** the blue fall on the same timestep.\n  - Every timestep (after the action effect, unless the action is blocked), all blue cells fall one row downward. If a blue cell would land on a non\u2011background cell (green, mediumpurple, gold, gray, or another blue), it disappears instead of moving there. If it would fall below row 15, it disappears.\n\n- Action blocking:\n  - A movement action (up/down/left/right) is blocked if: (a) the moving block cannot move in that direction (gray cannot up/down; gold only via click), (b) the movement would shift any part of the block out of bounds, or (c) any target cell is occupied by a non\u2011background cell that is **not** the other block (i.e., green, mediumpurple, blue, or the moving block itself \u2013 the latter never occurs).  \n  - A **click** is blocked if gold would go out of bounds or any target cell is occupied by a non\u2011background cell that is **not** gray.  \n  - When an action is blocked, the entire state remains unchanged: no action effect, no blue fall, no blue spawn.  \n  - A **noop** action never blocks; blue fall and possible spawn occur normally.\n\n- Overlap removal: When a moving block\u2019s new position includes cells occupied by the other block, those cells of the other block are removed (the moving block occupies them). This applies both to gray moving left/right onto gold and gold moving right onto gray."}},
{"idx": 7, "score": 0.825, "parents": "2", "role": "", "components": {"perception": "import json\nimport re\nimport ast\nfrom collections import Counter\n\ndef _parse_grid(obs: str):\n    \"\"\"Return a 2D list of cell values (integers or strings) parsed from obs.\"\"\"\n    if '[[' in obs:\n        # Autumn JSON grid\n        start = obs.find('[[')\n        end = obs.rfind(']]') + 2\n        if end <= start:\n            raise ValueError(\"Cannot locate grid boundaries\")\n        grid_str = obs[start:end]\n        return json.loads(grid_str)      # list of lists of strings\n    else:\n        # ARC integer grid\n        lines = obs.splitlines()\n        grid_lines = []\n        in_grid = False\n        for line in lines:\n            if '<grid_' in line:\n                in_grid = True\n                continue\n            if in_grid:\n                if line.strip().startswith('<grid_'):\n                    break\n                if line.strip().startswith('['):\n                    grid_lines.append(line.strip())\n        if not grid_lines:\n            raise ValueError(\"No grid lines found\")\n        return [ast.literal_eval(line) for line in grid_lines]\n\ndef _extract_step(obs: str) -> str:\n    \"\"\"Return step number or action count as a string, empty if not found.\"\"\"\n    # Try Step: or Action count:\n    m = re.search(r'\\bStep:\\s*(\\d+)', obs)\n    if m:\n        return m.group(1)\n    m = re.search(r'Action count:\\s*(\\d+)', obs)\n    if m:\n        return m.group(1)\n    return \"?\"\n\ndef _non_bg_cells(grid):\n    \"\"\"Return (background, list of (r,c,value)) for non-background cells.\"\"\"\n    flat = [cell for row in grid for cell in row]\n    bg = Counter(flat).most_common(1)[0][0]\n    cells = [(r, c, cell) for r, row in enumerate(grid)\n             for c, cell in enumerate(row) if cell != bg]\n    return bg, cells\n\ndef _compute_velocities(current_cells, prev_cells):\n    \"\"\"\n    For each current cell (r,c,color), estimate its velocity by matching\n    to the closest previous cell of the same colour. Returns dict mapping\n    (r,c) -> (dr, dc) or (0,0) if no match.\n    \"\"\"\n    # Build index of previous cells by colour\n    prev_by_color = {}\n    for pr, pc, pcolor in prev_cells:\n        prev_by_color.setdefault(pcolor, []).append((pr, pc))\n\n    used = set()   # indices of previous cells already matched\n    velocities = {}\n    # Process current cells\n    for idx, (r, c, color) in enumerate(current_cells):\n        best_dist = None\n        best_dr = best_dc = 0\n        prev_list = prev_by_color.get(color, [])\n        for pi, (pr, pc) in enumerate(prev_list):\n            if pi in used:\n                continue\n            dist = abs(r - pr) + abs(c - pc)\n            # Only consider plausible moves (distance <= 3)\n            if dist <= 3 and (best_dist is None or dist < best_dist):\n                best_dist = dist\n                best_dr = r - pr\n                best_dc = c - pc\n                best_pi = pi\n        if best_dist is not None:\n            velocities[(r, c)] = (best_dr, best_dc)\n            used.add(best_pi)\n        else:\n            velocities[(r, c)] = (0, 0)\n    return velocities\n\ndef perceive(observation_history: list[str]) -> str:\n    \"\"\"\n    Parse the raw observation (last element of observation_history) and return\n    a concise text summary of decision-relevant features, including step number,\n    grid dimensions, all non-background cells with estimated velocities.\n    The output changes on every step (even if the grid is identical) because\n    the step/action count is included, guaranteeing that consecutive states\n    yield different strings when the world changes.\n    Never raises, never returns an empty string.\n    \"\"\"\n    if not observation_history:\n        return \"perception_error: empty history\"\n\n    obs = observation_history[-1]\n    try:\n        # 1. Extract step/action count\n        step = _extract_step(obs)\n\n        # 2. Parse current grid\n        grid = _parse_grid(obs)\n        if not grid or not grid[0]:\n            raise ValueError(\"Empty grid\")\n        rows = len(grid)\n        cols = len(grid[0])\n        bg, current_cells = _non_bg_cells(grid)\n\n        # 3. If there is a previous observation, compute velocities\n        velocities = {}\n        if len(observation_history) >= 2:\n            prev_obs = observation_history[-2]\n            try:\n                prev_grid = _parse_grid(prev_obs)\n                _, prev_cells = _non_bg_cells(prev_grid)\n                velocities = _compute_velocities(current_cells, prev_cells)\n            except Exception:\n                # If previous parse fails, ignore velocities\n                pass\n\n        # 4. Build output string\n        parts = [f\"step {step}; grid {rows}x{cols}; bg {bg}\"]\n        if current_cells:\n            cell_strs = []\n            for r, c, color in current_cells:\n                dr, dc = velocities.get((r, c), (0, 0))\n                if dr != 0 or dc != 0:\n                    cell_strs.append(f\"r{row}c{col}:{color}+{dr},{dc}\")\n                else:\n                    cell_strs.append(f\"r{r}c{c}:{color}\")\n            all_cells = \"; \".join(cell_strs)\n            # Enforce character limit (leave ~100 for prefix)\n            max_len = 1900\n            if len(all_cells) > max_len:\n                all_cells = all_cells[:max_len-3] + \"...\"\n            parts.append(f\"non_bg: {all_cells}\")\n        else:\n            parts.append(\"non_bg: none\")\n\n        return \"; \".join(parts)\n\n    except Exception as e:\n        # Fallback \u2013 never raise, never return empty\n        step = _extract_step(observation_history[-1])\n        return f\"step {step}; perception_parse_error: {e}\"", "world_knowledge": ""}},

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
