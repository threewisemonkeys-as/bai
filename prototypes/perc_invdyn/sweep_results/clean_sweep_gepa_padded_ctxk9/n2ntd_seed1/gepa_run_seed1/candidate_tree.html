_positions = []   # mediumpurple\n        blue_positions = []\n\n        for r in range(rows_count):\n            for c in range(cols_count):\n                cell = grid[r][c]\n                if grid_type == 'string':\n                    colour_name = cell.lower() if isinstance(cell, str) else str(cell)\n                    if colour_name == 'white':\n                        continue\n                    short = color_short.get(colour_name, colour_name[:2])\n                else:  # integer grid\n                    val = int(cell)\n                    if val == 0:\n                        continue\n                    short = str(val)\n                    colour_name = str(val)\n\n                cells.append((r, c, short))\n\n                if colour_name in ('red', '2'):\n                    player_pos = (r, c)\n                elif colour_name in ('gold', '4'):\n                    gold_positions.append((r, c))\n                elif colour_name in ('darkorange', '7'):\n                    platform_positions.append((r, c))\n                elif colour_name in ('mediumpurple', '6'):\n                    moving_platform_positions.append((r, c))\n                elif colour_name in ('blue', '1'):\n                    blue_positions.append((r, c))\n\n        # --- build summary parts ---\n        parts = []\n        # metadata\n        meta_parts = []\n        if step is not None:\n            meta_parts.append(f\"step:{step}\")\n        if action_count is not None:\n            meta_parts.append(f\"ac:{action_count}\")\n        if levels_completed is not None:\n            meta_parts.append(f\"lvl:{levels_completed}\")\n        if meta_parts:\n            parts.append(' '.join(meta_parts))\n\n        parts.append(f\"grid:{rows_count}x{cols_count}\")\n\n        # all non-background cells grouped by colour\n        if cells:\n            by_color = {}\n            for r, c, short in cells:\n                by_color.setdefault(short, []).append((r, c))\n            colour_strings = []\n            for colour in sorted(by_color.keys()):\n                pos_list = by_color[colour]\n                sorted_pos = sorted(pos_list)\n                pos_str = ','.join(f\"({r},{c})\" for r, c in sorted_pos)\n                colour_strings.append(f\"{colour}:{pos_str}\")\n            parts.append(\"cells:\" + ';'.join(colour_strings))\n        else:\n            parts.append(\"all_white\")\n\n        # derived features\n        if player_pos:\n            parts.append(f\"player:({player_pos[0]},{player_pos[1]})\")\n            # gravity\n            if player_pos[0] + 1 < rows_count:\n                r, c = player_pos\n                below = grid[r+1][c]\n                if grid_type == 'string':\n                    is_empty = (below.lower() if isinstance(below, str) else str(below)) == 'white'\n                else:\n                    is_empty = (int(below) == 0)\n                parts.append(\"gravity:down\" if is_empty else \"gravity:none\")\n            else:\n                parts.append(\"gravity:none\")\n        else:\n            # player not visible (e.g. on gold) \u2013 we can't infer gravity reliably\n            pass\n\n        # explicit lists (redundant but helpful)\n        if gold_positions:\n            parts.append(\"golds:\" + ','.join(f\"({r},{c})\" for r,c in gold_positions))\n        if moving_platform_positions:\n            parts.append(\"mp:\" + ','.join(f\"({r},{c})\" for r,c in moving_platform_positions))\n\n        result = \" | \".join(parts)\n\n        if not result.strip():\n            result = \"grid: no_features\"\n        if len(result) > 1900:\n            result = result[:1900] + \"...\"\n\n        return result\n\n    except Exception as e:\n        return f\"grid: error_{str(e)[:60]}\"", "world_knowledge": ""}},

he last known position for collision and movement purposes.  \n- **Actions and their effects:**  \n  - **up:** Player moves 4 cells upward (row \u2192 row \u2013 4). Sets gravity to `down`.  \n  - **down:** Player moves 1 cell downward (row \u2192 row + 1). If row would become >11, action has no effect.  \n  - **left:** Player moves 1 cell left (col \u2192 col \u2013 1). If col would become <0, action has no effect.  \n  - **right:** Player moves 1 cell right (col \u2192 col + 1). If col would become >11, action has no effect.  \n  - **noop:** If gravity is `down`, the player falls 1 cell down (row \u2192 row + 1) and gravity resets to `none`. Otherwise, no change.  \n  - **click:** If performed on the cell the player currently occupies, a mine (MP) is created at that cell (only one mine can exist at a time). Click on any other cell has no effect.  \n- **Movement block:** The player cannot move onto a cell occupied by a `DO` (dark object) or `Bl` (blocker). If a movement action would place the player on such a cell, the action is ineffective and the state does not change.  \n- **Gold collection:** If a movement action places the player on a cell containing a gold (`Gd`), the gold is removed and the player appears on that cell (no click required).  \n- **Gravity:**  Starts as `none`. Becomes `down` after an `up` action. Resets to `none` after a fall occurs (player moves down due to gravity). Gravity is not changed by `down`, `left`, `right`, or `click`.  \n- **Mine (MP):** After creation, on each subsequent `noop` action, the mine moves upward 1 row for exactly 2 steps (i.e., it moves twice and then stays still). If the mine reaches row 1, it disappears.  \n- **Step counter:** Increases by 1 each action, but does not directly affect dynamics.  \n- **Bl cells** change each step in a deterministic pattern unrelated to player actions; they are obstacles the player cannot occupy."}},

id).  \n  - `Bl`: breakable blocks (destroyed by mines).  \n  - `MP`: mine (appears after certain clicks).  \n- Gravity is a state property (`gravity:none` or `gravity:down`).  \n- The bottom row (row 11) and any cell with a DO are solid (ground). A cell is \u201csupported\u201d if the cell directly below it (row+1, same column) is solid.\n\n**Action effects:**\n\n1. **noop**  \n   - If `gravity:down` and the player is present, the player falls one row downward (row+1) unless blocked by a solid cell; if the new cell is supported, gravity becomes `none`; otherwise remains `down`.  \n   - If `gravity:none`, nothing changes.  \n   - If a `MP` (mine) exists, it moves upward one row (row-1) unless the target cell is occupied by a DO or is outside the grid (row < 0); in that case it stops or disappears. When a mine moves, it destroys all Bl cells in the four cardinal directions (up, down, left, right) from its new location.\n\n2. **directional actions (left, right, up, down)**  \n   - **left/right**: player\u2019s column changes by \u00b11 (if player present).  \n   - **up**: player\u2019s row changes by \u20134 (to row 7) \u2013 consistent with jumping to a platform.  \n   - **down**: no observed; assumed to move player downward by 1 row (if player present).  \n   - After the move, gravity is set to `down` if the new cell is *not* supported (i.e., the cell below is empty and not solid), otherwise `none`.  \n   - If the player is absent, these actions have no effect (the only way to restore the player is a click).\n\n3. **click (click ROW COL)**  \n   - If the player is **absent** and the target cell contains a gold, the player appears at that cell and the gold is removed (collected).  \n   - If the player is **present** and the target cell is the player\u2019s own cell, a mine (`MP`) appears at that cell, the player disappears, and on the next `noop` the mine moves up while the player reappears at the original cell.  \n   - Other click outcomes are not observed (e.g., clicking empty cells).\n\n**Additional dynamics:**\n- Mines move upward one row per `noop` (after the first noop following creation) unless blocked by a DO or the grid top. They destroy adjacent Bl in a cross when moving.\n- Gold tiles are collectible; once collected they vanish. The player can stand on empty cells; only DO and the bottom row provide solid ground."}},

e last known position for collision and movement purposes.  \n- **Actions and their effects:**  \n  - **up:** Player moves 4 cells upward (row \u2192 row \u2013 4). Sets gravity to `down`. If target row < 0, action has no effect (player stays, gravity unchanged).  \n  - **down:** Player moves 1 cell downward (row \u2192 row + 1). If row would become >11, action has no effect. Does not change gravity.  \n  - **left:** Player moves 1 cell left (col \u2192 col \u2013 1). If col would become <0, action has no effect. Does not change gravity.  \n  - **right:** Player moves 1 cell right (col \u2192 col + 1). If col would become >11, action has no effect. Does not change gravity.  \n  - **noop:** If gravity is `down`, the player falls 1 cell down (row \u2192 row + 1) and gravity resets to `none`. Otherwise, no movement and gravity remains unchanged.  \n  - **click ROW COL:** If performed on the cell the player currently occupies, a mine (MP) is created at that cell. Only one mine can exist at a time; if a mine already exists, click has no effect. Click on any other cell has no effect.  \n- **Movement block:** A movement action (up/down/left/right) has no effect if the target cell is occupied by a `DO` (dark object) or `Bl` (blocker). The player does not move and the state remains unchanged.  \n- **Gold collection:** If a movement action (including a fall from `noop` with gravity) places the player on a cell containing a gold (`Gd`), the gold is removed (disappears from the cell list) and the player appears on that cell (the player\u2019s `R:` shows at that cell). No extra action is needed.  \n- **Gravity:** Starts as `none`. Only `up` sets gravity to `down`. A `noop` while gravity is `down` resets gravity to `none` after the fall. Other actions never change gravity.  \n- **Mine (MP) dynamics:**  \n  - After creation, on each subsequent `noop` action, the mine moves upward 1 row (row \u2192 row \u2013 1).  \n  - The mine moves on every `noop` (no limit on number of moves). {"idx": 8, "score": 0.65, "parents": "7", "role": "", "components": {"perception": "import json\nimport re\nfrom typing import Optional, List, Tuple, Dict, Any\n\ndef _parse_observation(obs: str) -> dict:\n    \"\"\"\n    Parse a single raw observation string.\n    Returns a dictionary with keys:\n        step, action_count, levels_completed,\n        grid (list of lists), grid_type, rows, cols,\n        player_pos (None if not found), golds, darkoranges,\n        mediumpurples, blues, other_cells (list of (r,c,colour_short)),\n        gravity (string or None)\n    \"\"\"\n    result = {\n        'step': None,\n        'action_count': None,\n        'levels_completed': None,\n        'grid': None,\n        'grid_type': None,\n        'rows': 0,\n        'cols': 0,\n        'player_pos': None,\n        'golds': [],\n        'darkoranges': [],\n        'mediumpurples': [],\n        'blues': [],\n        'other_cells': [],\n        'gravity': None\n    }\n\n    # --- extract metadata ---\n    for line in obs.split('\\n'):\n        line = line.strip()\n        m = re.match(r'Step:\\s*(\\d+)', line)\n        if m:\n            result['step'] = int(m.group(1))\n        m = re.match(r'Action count:\\s*(\\d+)', line)\n        if m:\n            result['action_count'] = int(m.group(1))\n        m = re.match(r'Levels completed:\\s*(\\d+)/', line)\n        if m:\n            result['levels_completed'] = int(m.group(1))\n\n    # --- detect and parse grid ---\n    grid = None\n    grid_type = None\n\n    # Try Autumn string grid (JSON 2D array of strings)\n    if '[[' in obs and ']]' in obs:\n        try:\n            start = obs.find('[[')\n            end = obs.rfind(']]') + 2\n            json_str = obs[start:end]\n            parsed = json.loads(json_str)\n            if isinstance(parsed, list) and len(parsed) > 0 and isinstance(parsed[0], list):\n                grid = parsed\n                grid_type = 'string'\n        except Exception:\n            pass\n\n    # Try ARC integer grid\n    if grid is None:\n        try:\n            rows = []\n            in_grid = False\n            for line in obs.split('\\n'):\n                line_stripped = line.strip()\n                if line_stripped.startswith('<grid_'):\n                    in_grid = True\n                    continue\n                if in_grid and line_stripped.startswith('[') and line_stripped.endswith(']'):\n                    row_str = line_stripped.strip('[]')\n                    row = [int(x.strip()) for x in row_str.split(',')]\n                    rows.append(row)\n                elif in_grid and not line_stripped.startswith('['):\n                    if line_stripped.startswith('<') or line_stripped.startswith('='):\n                        break\n            if rows:\n                grid = rows\n                grid_type = 'int'\n        except Exception:\n            pass\n\n    if grid is None or len(grid) == 0 or len(grid[0]) == 0:\n        return result\n\n    result['grid'] = grid\n    result['grid_type'] = grid_type\n    rows = len(grid)\n    cols = len(grid[0])\n    result['rows'] = rows\n    result['cols'] = cols\n\n    # Colour mapping (short names)\n    color_short = {\n        'white': 'W', 'black': 'Bk', 'blue': 'Bl', 'red': 'R',\n        'green': 'G', 'gold': 'Gd', 'gray': 'Gy', 'lightgray': 'LGy',\n        'darkgray': 'DGy', 'lightblue': 'LBl', 'darkgreen': 'DG',\n        'darkorange': 'DO', 'mediumpurple': 'MP', 'purple': 'P',\n        'orange': 'O', 'yellow': 'Y', 'magenta': 'M', 'cyan': 'C',\n        'brown': 'Br', 'pink': 'Pk', 'maroon': 'Mr', 'navy': 'Nv',\n        'teal': 'Tl', 'olive': 'Ol', 'lime': 'Lm', 'indigo': 'In',\n        'violet': 'V', 'turquoise': 'Tq', 'tan': 'Tn', 'coral': 'Cr',\n        'salmon': 'Sm', 'plum': 'Pl', 'orchid': 'Or', 'lavender': 'Lv'\n    }\n\n    player_pos = None\n    golds = []\n    darkoranges = []\n    mediumpurples = []\n    blues = []\n    other_cells = []\n\n    for r in range(rows):\n        for c in (r, c))\n            colour_strs = []\n            for col in sorted(by_colour.keys()):\n                pos_list = by_colour[col]\n                pos_str = ','.join(f\"({r},{c})\" for r, c in pos_list)\n                colour_strs.append(f\"{col}:{pos_str}\")\n            parts.append(\"cells:\" + ';'.join(colour_strs))\n        else:\n            parts.append(\"all_white\")\n\n        # Player position and gravity\n        if current['player_pos'] is not None:\n            r, c = current['player_pos']\n            parts.append(f\"player:({r},{c})\")\n            if current['gravity'] is not None:\n                parts.append(f\"gravity:{current['gravity']}\")\n        else:\n            # Player not visible: use last known from previous state\n            if previous is not None and previous['player_pos'] is not None:\n                r, c = previous['player_pos']\n                parts.append(f\"lastplayer:({r},{c})\")\n                # Carry forward gravity from previous state\n                if previous['gravity'] is not None:\n                    parts.append(f\"gravity:{previous['gravity']}\")\n            # else no gravity output\n\n        # Explicit lists for quick reference\n        if current['golds']:\n            parts.append(\"golds:\" + ','.join(f\"({r},{c})\" for r,c in current['golds']))\n        if current['mediumpurples']:\n            parts.append(\"mp:\" + ','.join(f\"({r},{c})\" for r,c in current['mediumpurples']))\n\n        result = \" | \".join(parts)\n\n        # Ensure non-empty and within length limit\n        if not result.strip():\n            result = \"grid: no_features\"\n        if len(result) > 1900:\n            result = result[:1900] + \"...\"\n\n        return result\n\n    except Exception as e:\n        # Never raise, never return empty\n        return f\"grid: error_{str(e)[:60]}\"", "world_knowledge": "- The grid is 12\u00d712 (rows 0\u201311, cols 0\u201311).  \n- The player is represented by \u201cR:(row,col)\u201d i DO`: indestructible obstacles (solid).  \n  - `Bl`: breakable blocks (destroyed by mines).  \n  - `MP`: mine (appears after certain clicks).  \n- Gravity is a state property (`gravity:none` or `gravity:down`).  \n- The bottom row (row 11) and any cell with a DO are solid (ground). A cell is \u201csupported\u201d if the cell directly below it (row+1, same column) is solid.\n\n**Action effects:**\n\n1. **noop**  \n   - If `gravity:down` and the player is present, the player falls one row downward (row+1) unless blocked by a solid cell; if the new cell is supported, gravity becomes `none`; otherwise remains `down`.  \n   - If `gravity:none`, nothing changes.  \n   - If a `MP` (mine) exists, it moves upward one row (row-1) unless the target cell is occupied by a DO or is outside the grid (row < 0); in that case it stops or disappears. When a mine moves, it destroys all Bl cells in the four cardinal directions (up, down, left, right) from its new location.\n\n2. **directional actions (left, right, up, down)**  \n   - **left/right**: player\u2019s column changes by \u00b11 (if player present).  \n   - **up**: player\u2019s row changes by \u20134 (to row 7) \u2013 consistent with jumping to a platform.  \n   - **down**: no observed; assumed to move player downward by 1 row (if player present).  \n   - After the move, gravity is set to `down` if the new cell is *not* supported (i.e., the cell below is empty and not solid), otherwise `none`.  \n   - If the player is absent, these actions have no effect (the only way to restore the player is a click).\n\n3. **click (click ROW COL)**  \n   - If the player is **absent** and the target cell contains a gold, the player appears at that cell and the gold is removed (collected).  \n   - If the player is **present** and the target cell is the player\u2019s own cell, a mine (`MP`) appears at that cell, the player disappears, and on the next `noop` the mine moves up while the player reappears at the original cell.  \n   - Other click outcomes are not observed (e.g., clicking empty cells).\n\n**Additional dynamics:**\n- Mines move upward one row per `noop` (after the first noop following creation) unless blocked by a DO or the grid top. They destroy adjacent Bl in a cross when moving.\n- Gold tiles are collectible; once collected they vanish. The player can stand on empty cells; only DO and the bottom row provide solid ground."}},

, destroyed by mines), `MP` (mine).  \n- The bottom row (row 11) is solid ground. `DO` cells are also solid. A cell is **supported** if the cell directly below (row+1, same col) is solid (bottom row or DO).  \n- Gravity is a state property: either `down` or `none`.\n\n**Action effects:**\n\n1. **noop**  \n   - If a mine (`MP`) exists:  \n     - The mine moves upward one row (row-1) unless the target cell is occupied by a `DO` or is outside the grid (row < 0).  \n       - If the target cell contains a `DO`, the mine stays at its current location (does not move).  \n       - If the target cell is outside (row < 0), the mine disappears (removed).  \n     - After moving (or staying), the mine destroys all `Bl` cells in the four cardinal directions (up, down, left, right) from its **new** location (or current location if blocked).  \n   - If gravity is `down` and the player is present:  \n     - The player moves down one row (row+1) if that row exists (row \u2264 10) and the target cell is not a `DO`.  \n     - After moving, gravity is set to `down` if the new cell is unsupported, otherwise `none`.  \n   - If gravity is `none` or player absent: no change to player.  \n\n2. **directional actions (left, right, up, down)**  \n   - If the player is absent: no effect.  \n   - If the player is present:  \n     - **left/right**: column changes by \u00b11 (must stay within 0-11).  \n     - **up**: row decreases by 4 (must stay \u2265 0).  \n     - **down**: row increases by 1 (must stay \u2264 11).  \n     - After the move, if the target cell contains gold (`Gd`):  \n       - The gold is collected (removed).  \n       - The player **disappears** immediately (player becomes absent).  \n       - On the **following noop**, the player reappears at the cell one row below (row+1) if that row exists and gravity is `down` and the original gold cell was unsupported; otherwise the player reappears at the gold cell itself (if supported). The reappearance also collects any gold at that new cell (if present).  \n     - If the target cell does not contain gold:  \n       - The player moves to that cell (provided it is not a `DO` \u2013 not observed but assumed impassable).  \n       - After moving, gravity is set to `down` if the new cell is unsupported, otherwise `none`.  \n\n3. **click (click ROW COL)**  \n   - If the player is **absent** and the clicked cell contains gold:  \n     - The gold is collected (removed).  \n     - The player appears at that cell.  \n     - If gravity is `down` and the cell is unsupported, the player immediately falls one row (row+1) and gravity remains `down` (if still unsupported) or becomes `none` (if supported after fall).  \n   - If the player is **present** and the clicked cell is the player\u2019s own cell:  \n     - A mine (`MP`) appears at that cell.  \n     - The player disappears (becomes absent).  \n     - On the **next noop**, the mine moves upward one row (as per noop rules), and the player reappears at the original cell (the cell where the mine was created).  \n   - Other click outcomes (e.g., clicking empty cells, obstacles, or non\u2011gold cells when player absent) have no effect (state unchanged).\n\n**Additional rules:**\n- Directional actions (left, right, up, down) **never** affect mines; mines only move on `noop`.  \n- `Bl` cells are destroyed only by mine cross explosions; they do not move or shift on their own.  \n- When the player is absent and no mine exists, `noop` leaves the entire state unchanged.  \n- Gravity is evaluated after every action that moves the player (including fall from gravity or click\u2011induced fall).  \n- If a move would place the player on a `DO`, the move is blocked (no movement).  \n- When a player moves onto a gold cell via a directional action, the gold is collected immediately, but the player\u2019s reappearance is deferred to the next `noop` (to handle fall). This deferred reappearance does not produce a full state change until that `noop` is taken."}},

cise summary.\n    Uses the previous observation (if available) to fill missing player\n    position and gravity, making the state change fully recoverable.\n    Implements game rules: gravity only changes on up (row-4),\n    gold collected when player steps on it, player hidden on mine cells.\n    \"\"\"\n    try:\n        # Parse current observation\n        current = _parse_observation(observation_history[-1])\n        # Parse previous observation if exists\n        previous = None\n        if len(observation_history) >= 2:\n            previous = _parse_observation(observation_history[-2])\n\n        # --- Determine player position ---\n        player_pos = current['player_pos']  # from raw grid if visible\n        if player_pos is None and previous is not None and previous['player_pos'] is not None:\n            # Player not visible in raw \u2013 check if there is a mine at that cell\n            pr, pc = previous['player_pos']\n            in_bounds = 0 <= pr < current['rows'] and 0 <= pc < current['cols']\n            if in_bounds and current['grid'] is not None:\n                cell = current['grid'][pr][pc]\n                if current['grid_type'] == 'int':\n                    is_mine = (int(cell) == 6)\n                else:\n                    is_mine = (cell.lower().strip() == 'mediumpurple')\n                if not is_mine:\n                    # Player is still there but invisible (e.g. under gold)\n                    player_pos = (pr, pc)\n                # else player is covered by mine \u2013 do not report\n            else:\n                # grid may be incomplete, fall back to previous\n                player_pos = (pr, pc)\n\n        # --- Compute gravity (game rules: only up changes it) ---\n        gravity = None\n        if previous is not None and previous['player_pos'] is not None and player_pos is not None:\n            # Detect up action: row decreased by exactly 4\n            if player_pos[0] == previous['player_pos'][0] - 4:\n                gravity = 'down'\n            else:\n                # Carry over previous gravity\n                gravity = previous['gravity']\n        elif player_pos is not None:\n            # No previous state \u2013 compute from raw grid\n            r, c = player_pos\n            if r + 1 < current['rows']:\n                below = current['grid'][r+1][c]\n                if current['grid_type'] == 'int':\n                    gravity = 'down' if int(below) == 0 else 'none'\n                else:\n                    gravity = 'down' if below.strip().lower() == 'white' else 'none'\n            else:\n                gravity = 'none'\n\n        # --- Adjust gold list for collection ---\n        golds = list(current['golds'])  # copy\n        if previous is not None and player_pos is not None:\n            # If player stepped on a gold from previous state, remove it\n            if player_pos in previous['golds'] and player_pos in golds:\n                golds.remove(player_pos)\n\n        # --- Build output ---\n        parts = []\n\n        # Metadata\n        meta = []\n        if current['step'] is not None:\n            meta.append(f\"step:{current['step']}\")\n        if current['action_count'] is not None:\n            meta.append(f\"ac:{current['action_count']}\")\n        if current['levels_completed'] is not None:\n            meta.append(f\"lvl:{current['levels_completed']}\")\n        if meta:\n            parts.append(' '.join(meta))\n\n        # Grid dimensions\n        parts.append(f\"grid:{current['rows']}x{current['cols']}\")\n\n        # All non-white cells (grouped by colour)\n        cell_list = []\n        # Blues\n        for pos in current['blues']:\n            cell_list.append(('Bl', pos))\n        # Darkoranges\n        for pos in current['darkoranges']:\n            cell_list.append(('DO', pos))\n        # Golds (after collection adjustment)\n        for pos in golds:\n            cell_list.append(('Gd', pos))\n        # Player (red)\n        if player_pos is not None:\n            cell_list.append(('R', player_pos))\n        # Mediumpurples (mines)\n        for pos in current['mediumpurples']:\n            cell_list.append(('MP', pos))\n        # Other cells\n        for r, c, short in current['other_cells']:\n            cell_list.append((short, (r, c)))\n\n        # Sort by colour then position\n        cell_list.sort(key=lambda x: (x[0], x[1][0], x[1][1]))\n\n        if cell_list:\n            by_colour = {}\n            for col, (r, c) in cell_list:\n                by_colour.setdefault(col, []).append((r, c))\n            colour_strs = []\n            for col in sorted(by_colour.keys()):\n                pos_list = by_colour[col]\n                pos_str = ','.join(f\"({r},{c})\" for r, c in pos_list)\n                colour_strs.append(f\"{col}:{pos_str}\")\n            parts.append(\"cells:\" + ';'.join(colour_strs))\n        else:\n            parts.append(\"all_white\")\n\n        # Player position\n        if player_pos is not None:\n            r, c = player_pos\n            parts.append(f\"player:({r},{c})\")\n        else:\n            # No player known \u2013 try to carry last known from previous for reference\n            if previous is not None and previous['player_pos'] is not None:\n                pr, pc = previous['player_pos']\n                parts.append(f\"lastplayer:({pr},{pc})\")\n\n        # Gravity\n        if gravity is not None:\n            parts.append(f\"gravity:{gravity}\")\n\n        # Explicit lists for quick reference\n        if golds:\n            parts.append(\"golds:\" + ','.join(f\"({r},{c})\" for r,c in golds))\n        if current['mediumpurples']:\n            parts.append(\"mp:\" + ','.join(f\"({r},{c})\" for r,c in current['mediumpurples']))\n\n        result = \" | \".join(parts)\n\n        # Ensure non-empty and within length limit\n        if not result.strip():\n            result = \"grid: no_features\"\n        if len(result) > 1900:\n {"idx": 12, "score": 0.65, "parents": "11", "role": "", "components": {"perception": "import json\nimport re\nfrom typing import Optional, List, Tuple, Dict, Any\n\ndef _extract_metadata(obs: str) -> Dict[str, Optional[int]]:\n    \"\"\"Extract step, action_count, levels_completed from the observation text.\"\"\"\n    meta = {'step': None, 'action_count': None, 'levels_completed': None}\n    for line in obs.split('\\n'):\n        line = line.strip()\n        m = re.match(r'Step:\\s*(\\d+)', line)\n        if m:\n            meta['step'] = int(m.group(1))\n        m = re.match(r'Action count:\\s*(\\d+)', line)\n        if m:\n            meta['action_count'] = int(m.group(1))\n        m = re.match(r'Levels completed:\\s*(\\d+)/', line)\n        if m:\n            meta['levels_completed'] = int(m.group(1))\n    return meta\n\n\ndef _parse_grid(obs: str) -> Tuple[Optional[List[List]], Optional[str], int, int]:\n    \"\"\"\n    Attempt to parse the grid from the observation.\n    Returns (grid, grid_type, rows, cols).\n    grid_type is 'string' (Autumn colours) or 'int' (ARC integers) or None.\n    \"\"\"\n    grid = None\n    grid_type = None\n    rows = 0\n    cols = 0\n\n    # ----- Autumn string grid (JSON 2D array) -----\n    if '[[' in obs and ']]' in obs:\n        try:\n            start = obs.find('[[')\n            end = obs.rfind(']]') + 2\n            json_str = obs[start:end]\n            parsed = json.loads(json_str)\n            if isinstance(parsed, list) and len(parsed) > 0 and isinstance(parsed[0], list):\n                grid = parsed\n                grid_type = 'string'\n                rows = len(grid)\n                cols = len(grid[0]) if rows > 0 else 0\n        except Exception:\n            pass\n\n    # ----- ARC integer grid (lines starting with <grid_k>) -----\n    if grid is None:\n        try:\n            rows_list = []\n            in_grid = False\n            for line in obs.split('\\n'):\n                line_stripped = line.strip()\n                if line_stripped.startswith('<grid_'):\n                    in_grid = True\n                    continue\n                if in_grid:\n                    if line_stripped.startswith('[') and line_stripped.endswith(']'):\n                        row_str = line_stripped.strip('[]')\n                        row = [int(x.strip()) for x in row_str.split(',')]\n                        rows_list.append(row)\n                    elif line_stripped == '' or line_stripped.startswith('=') or line_stripped.startswith('<'):\n                        # End of grid region\n                        break\n            if rows_list:\n                grid = rows_list\n                grid_type = 'int'\n                rows = len(grid)\n                cols = len(grid[0]) if rows > 0 else 0\n        except Exception:\n            pass\n\n    if grid is None or rows == 0 or cols == 0:\n        return (None, None, 0, 0)\n\n    # Sanity check: all rows same length (if not, fall back)\n    if not all(len(row) == cols for row in grid):\n        grid = None\n        grid_type = None\n        rows = 0\n        cols = 0\n\n    return (grid, grid_type, rows, cols)\n\n\n# Mapping from colour names to short labels (for output compactness)\nCOLOUR_SHORT = {\n    'white': 'W', 'black': 'Bk', 'blue': 'Bl', 'red': 'R',\n    'green': 'G', 'gold': 'Gd', 'gray': 'Gy', 'lightgray': 'LGy',\n    'darkgray': 'DGy', 'lightblue': 'LBl', 'darkgreen': 'DG',\n    'darkorange': 'DO', 'mediumpurple': 'MP', 'purple': 'P',\n    'orange': 'O', 'yellow': 'Y', 'magenta': 'M', 'cyan': 'C',\n    'brown': 'Br', 'pink': 'Pk', 'maroon': 'Mr', 'navy': 'Nv',\n    'teal': 'Tl', 'olive': 'Ol', 'lime': 'Lm', 'indigo': 'In',\n    'violet': 'V', 'turquoise': 'Tq', 'tan': 'Tn', 'coral': 'Cr',\n    'salmon': 'Sm', 'plum': 'Pl', 'orchid': 'Or', 'lavender': 'Lv'\n}\n\n\ndef _get_cell_value(cell, grid_type):\n    \"\"\"Return (value, colour_name) for a cell.\"\"\"\n    if grid_type == 'string':\n        colour_name = cel \n                other_cells.append((r,c,short))\n                r_cells.append((short, (r,c)))\n\n    return r_cells, blues, darkoranges, golds, mediumpurples, other_cells\n\n\ndef perceive(observation_history: list[str]) -> str:\n    \"\"\"\n    Parse the current observation and return a concise, deterministic summary.\n    The output MUST allow a downstream system to recover the action between two\n    consecutive states. It must never raise, never return empty, and be <2000 chars.\n    \"\"\"\n    try:\n        # ----- Parse current observation -----\n        obs_cur = observation_history[-1]\n        meta_cur = _extract_metadata(obs_cur)\n        grid_cur, grid_type_cur, rows_cur, cols_cur = _parse_grid(obs_cur)\n\n        if grid_cur is None:\n            # fallback: report minimal info\n            parts = []\n            if meta_cur['step'] is not None:\n                parts.append(f\"step:{meta_cur['step']}\")\n            if meta_cur['action_count'] is not None:\n                parts.append(f\"ac:{meta_cur['action_count']}\")\n            parts.append(\"grid:0x0\")\n            result = \" | \".join(parts)\n            return result if result else \"grid:unparseable\"\n\n        # ----- Categorise cells of current grid -----\n        r_cells_cur, blues_cur, darkoranges_cur, golds_cur, mediumpurples_cur, other_cur = _categorize_cells(grid_cur, grid_type_cur)\n\n        # ----- Determine player position -----\n        # Look for the red cell (if visible)\n        player_pos_visible = None\n        for (short, (r,c)) in r_cells_cur:\n            if short == 'R':\n                player_pos_visible = (r,c)\n                break\n\n        # Try to infer player from previous state if not visible\n        player_pos = player_pos_visible\n        if player_pos is None and len(observation_history) >= 2:\n            obs_prev = observation_history[-2]\n            meta_prev = _extract_metadata(obs_prev)\n            grid_prev, grid_type_prev, rows_prev, cols_p ne.strip()\n                if line_stripped.startswith('<grid_'):\n                    in_grid = True\n                    continue\n                if in_grid:\n                    if line_stripped.startswith('[') and line_stripped.endswith(']'):\n                        row_str = line_stripped.strip('[]')\n                        row = [int(x.strip()) for x in row_str.split(',')]\n                        rows_list.append(row)\n                    elif line_stripped == '' or line_stripped.startswith('=') or line_stripped.startswith('<'):\n                        break\n            if rows_list:\n                grid = rows_list\n                grid_type = 'int'\n                rows = len(grid)\n                cols = len(grid[0]) if rows > 0 else 0\n        except Exception:\n            pass\n\n    if grid is None or rows == 0 or cols == 0:\n        return (None, None, 0, 0)\n\n    # Sanity check: all rows same length\n    if not all(len(row) == cols for row in grid):\n        grid = None\n        grid_type = None\n        rows = 0\n        cols = 0\n\n    return (grid, grid_type, rows, cols)\n\n\n# Colour name to short label (for compact output)\nCOLOUR_SHORT = {\n    'white': 'W', 'black': 'Bk', 'blue': 'Bl', 'red': 'R',\n    'green': 'G', 'gold': 'Gd', 'gray': 'Gy', 'lightgray': 'LGy',\n    'darkgray': 'DGy', 'lightblue': 'LBl', 'darkgreen': 'DG',\n    'darkorange': 'DO', 'mediumpurple': 'MP', 'purple': 'P',\n    'orange': 'O', 'yellow': 'Y', 'magenta': 'M', 'cyan': 'C',\n    'brown': 'Br', 'pink': 'Pk', 'maroon': 'Mr', 'navy': 'Nv',\n    'teal': 'Tl', 'olive': 'Ol', 'lime': 'Lm', 'indigo': 'In',\n    'violet': 'V', 'turquoise': 'Tq', 'tan': 'Tn', 'coral': 'Cr',\n    'salmon': 'Sm', 'plum': 'Pl', 'orchid': 'Or', 'lavender': 'Lv'\n}\n\n\ndef _get_cell_value(cell, grid_type):\n    \"\"\"Return (value, short_label) for a cell.\"\"\"\n    if grid_type == 'string':\n        colour_name = cell.lower().strip()\n        short = COLOUR_SHORT.get(colour_name, colour_n ving_platform_positions = []   # mediumpurple / magenta 6\n        blue_positions = []\n\n        for r in range(rows_count):\n            for c in range(cols_count):\n                cell = grid[r][c]\n                if grid_type == 'string':\n                    colour_name = cell.lower() if isinstance(cell, str) else str(cell)\n                    if colour_name == 'white':\n                        continue\n                    short = color_short.get(colour_name, colour_name[:2])\n                else:  # integer grid\n                    val = int(cell)\n                    if val == 0:\n                        continue\n                    short = str(val)\n                    # map integer to colour name for special detection\n                    colour_name = str(val)\n\n                cells.append((r, c, short))\n\n                # detect red (player)\n                if colour_name in ('red', '2'):\n                    player_pos = (r, c)\n                elif colour_name in ('gold', '4'):\n                    gold_positions.append((r, c))\n                elif colour_name in ('darkorange', '7'):\n                    platform_positions.append((r, c))\n                elif colour_name in ('mediumpurple', '6'):\n                    moving_platform_positions.append((r, c))\n                elif colour_name in ('blue', '1'):\n                    blue_positions.append((r, c))\n\n        # --- build summary parts ---\n        parts = []\n        # metadata\n        meta_parts = []\n        if step is not None:\n            meta_parts.append(f\"step:{step}\")\n        if action_count is not None:\n            meta_parts.append(f\"ac:{action_count}\")\n        if levels_completed is not None:\n            meta_parts.append(f\"lvl:{levels_completed}\")\n        if meta_parts:\n            parts.append(' '.join(meta_parts))\n\n        parts.append(f\"grid:{rows_count}x{cols_count}\")\n\n        # all non-background cells grouped by colour\n        if cells:\n            by_color = {}\n            for r, c, short in cells:\n                by_color.setdefault(short, []).append((r, c))\n            colour_strings = []\n            for colour in sorted(by_color.keys()):\n                pos_list = by_color[colour]\n                sorted_pos = sorted(pos_list)\n                pos_str = ','.join(f\"({r},{c})\" for r, c in sorted_pos)\n                colour_strings.append(f\"{colour}:{pos_str}\")\n            parts.append(\"cells:\" + ';'.join(colour_strings))\n        else:\n            parts.append(\"all_white\")\n\n        # derived features: player (explicitly note absent)\n        if player_pos:\n            parts.append(f\"player:({player_pos[0]},{player_pos[1]})\")\n            # gravity\n            if player_pos[0] + 1 < rows_count:\n                r, c = player_pos\n                below = grid[r+1][c]\n                if grid_type == 'string':\n                    is_empty = (below.lower() if isinstance(below, str) else str(below)) == 'white'\n                else:\n                    is_empty = (int(below) == 0)\n                parts.append(\"gravity:down\" if is_empty else \"gravity:none\")\n            else:\n                parts.append(\"gravity:none\")\n        else:\n            parts.append(\"player:absent\")\n\n        # explicit lists (redundant but helpful)\n        if gold_positions:\n            parts.append(\"golds:\" + ','.join(f\"({r},{c})\" for r,c in gold_positions))\n        if moving_platform_positions:\n            parts.append(\"mp:\" + ','.join(f\"({r},{c})\" for r,c in moving_platform_positions))\n\n        result = \" | \".join(parts)\n\n        if not result.strip():\n            result = \"grid: no_features\"\n        if len(result) > 1900:\n            result = result[:1900] + \"...\"\n\n        return result\n\n    except Exception as e:\n        return f\"grid: error_{str(e)[:60]}\"", "world_knowledge": "- The grid is 12x12 (rows 0-11, cols 0-11).  \n- Objects:  \n  - `R`: player (one, may be absent).  \n  - `Gd`: gold (collectible, multiple).  \n  - `DO`: indestructible obstacles (solid).  \n  - `Bl`: breakable blocks (destroyed by mines).  \n  - `MP`: mine (appears after certain clicks).  \n- Gravity is a state property (`gravity:none` or `gravity:down`).  \n- The bottom row (row 11) and any cell with a DO are solid (ground). A cell is \u201csupported\u201d if the cell directly below it (row+1, same column) is solid.\n\n**Action effects:**\n\n1. **noop**  \n   - If `gravity:down` and the player is present, the player falls one row downward (row+1) unless blocked by a solid cell; if the new cell is supported, gravity becomes `none`; otherwise remains `down`.  \n   - If `gravity:none`, nothing changes.  \n   - If a `MP` (mine) exists, it moves upward one row (row-1) unless the target cell is occupied by a DO or is outside the grid (row < 0); in that case it stops or disappears. When a mine moves, it destroys all Bl cells in the four cardinal directions (up, down, left, right) from its new location.\n\n2. **directional actions (left, right, up, down)**  \n   - **left/right**: player\u2019s column changes by \u00b11 (if player present).  \n   - **up**: player\u2019s row changes by \u20134 (to row 7) \u2013 consistent with jumping to a platform.  \n   - **down**: no observed; assumed to move player downward by 1 row (if player present).  \n   - After the move, gravity is set to `down` if the new cell is *not* supported (i.e., the cell below is empty and not solid), otherwise `none`.  \n   - If the player is absent, these actions have no effect (the only way to restore the player is a click).\n\n3. **click (click ROW COL)**  \n   - If the player is **absent** and the target cell contains a gold, the player appears at that cell and the gold is removed (collected).  \n   - If the player is **present** and the target cell is the player\u2019s own cell, a mine (`MP`) appears at that cell, the player disappears, and on the next `noop` the mine moves up const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
