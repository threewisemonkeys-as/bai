    if blocks:\n                    raw = blocks[-1]  # last grid block\n                    rows = []\n                    for line in raw.strip().split('\\n'):\n                        line = line.strip()\n                        if line.startswith('[') and line.endswith(']'):\n                            nums = [int(x.strip()) for x in line[1:-1].split(',')]\n                            rows.append(nums)\n                    if rows:\n                        grid = rows\n            except Exception:\n                pass\n\n        if not grid or len(grid) == 0 or len(grid[0]) == 0:\n            return f\"step:{step};ac:{action_count};state:empty\"\n\n        h = len(grid)\n        w = len(grid[0])\n\n        # ---- Normalise to integer grid ----\n        colour_name_to_int = {\n            \"black\": 0, \"blue\": 1, \"red\": 2, \"green\": 3, \"yellow\": 4,\n            \"gray\": 5, \"magenta\": 6, \"orange\": 7, \"lightblue\": 8,\n            \"maroon\": 9, \"darkred\": 9, \"white\": 10, \"darkgray\": 11,\n            \"gold\": 12, \"light-gray\": 5, \"light_gray\": 5,\n            \"darkgreen\": 3, \"dark-blue\": 1, \"dark_blue\": 1,\n            \"sky-blue\": 8, \"sky_blue\": 8\n        }\n        if isinstance(grid[0][0], str):\n            int_grid = []\n            for row in grid:\n                int_row = [colour_name_to_int.get(c.lower(), 0) for c in row]\n                int_grid.append(int_row)\n            grid = int_grid\n\n        # ---- Identify phase: look for lightblue (8) or gold (12) ----\n        has_lightblue = any(v == 8 for row in grid for v in row)\n        has_gold = any(v == 12 for row in grid for v in row)\n        if has_lightblue:\n            phase = \"lightblue\"\n        elif has_gold:\n            phase = \"gold\"\n        else:\n            phase = \"unknown\"\n\n        # ---- Find agent (blue = 1) ----\n        agent_positions = [(r, c) for r in range(h) for c in range(w) if grid[r][c] == 1]\n        if not agent_positions:\n            # Fallback: look for an isolated coloured cell in black area\n            for r in range(h):\n                for c in range(w):\n                    if grid[r][c] != 0:\n                        isolated = True\n                        for dr in (-1, 0, 1):\n                            for dc in (-1, 0, 1):\n                                if dr == 0 and dc == 0:\n                                    continue\n                                nr, nc = r + dr, c + dc\n                                if 0 <= nr < h and 0 <= nc < w:\n                                    if grid[nr][nc] != 0 and grid[nr][nc] != grid[r][c]:\n                                        isolated = False\n                                        break\n                            if not isolated:\n                                break\n                        if isolated:\n                            agent_positions = [(r, c)]\n                            break\n                if agent_positions:\n                    break\n\n        if not agent_positions:\n            agent = (0, 0)\n        else:\n            agent = agent_positions[0]\n\n        # ---- On-gold flag ----\n        on_gold = (grid[agent[0]][agent[1]] == 12)\n\n        # ---- Build feature parts ----\n        parts = [f\"step:{step}\", f\"ac:{action_count}\", f\"phase:{phase}\",\n                 f\"agent:{agent[0]},{agent[1]}\"]\n        if on_gold:\n            parts.append(\"ongold\")\n\n        # Colour names for output\n        colour_name = {\n            5: \"gray\", 8: \"lightblue\", 12: \"gold\",\n            2: \"red\", 3: \"green\", 4: \"yellow\",\n            6: \"magenta\", 7: \"orange\", 9: \"maroon\",\n            10: \"white\", 11: \"darkgray\"\n        }\n\n        # Group cells by colour, skip black (0) and agent (1)\n        groups = {}\n        for r in range(h):\n            for c in range(w):\n                v = grid[r][c]\n                if v == 0 or v == 1:   # skip black and agent\n                    continue\n                name = colour_name.get(v, f\"c{v}\")\n                groups.setdefault(name, []).append((r, c))\n\n        # In gold phase, mark gold cells as static_gold, gray as moving_gray\n        # In lightblue phase, mark gray as static_gray, lightblue as moving_lightblue\n        if phase == \"gold\":\n            static_key = \"static_gold\"\n            moving_key = \"moving_gray\"\n        elif phase == \"lightblue\":\n            static_key = \"static_gray\"\n            moving_key = \"moving_lightblue\"\n        else:\n            static_key = \"static\"\n            moving_key = \"moving\"\n\n        for colour_name_str, cells in groups.items():\n            key = None\n            if phase == \"gold\":\n                if colour_name_str == \"gold\":\n                    key = static_key\n                elif colour_name_str == \"gray\":\n                    key = moving_key\n            elif phase == \"lightblue\":\n                if colour_name_str == \"gray\":\n                    key = static_key\n                elif colour_name_str == \"lightblue\":\n                    key = moving_key\n            else:\n                key = f\"static_{colour_name_str}\"\n\n            if key is None:\n                key = f\"static_{colour_name_str}\"\n\n            # Sort cells by row then column\n            sorted_cells = sorted(cells, key=lambda x: (x[0], x[1]))\n            # Limit to 100 cells per group to keep output short\n            cells_str = \";\".join(f\"{r},{c}\" for r, c in sorted_cells[:100])\n            parts.append(f\"{key}:{cells_str}\")\n            if len(cells) > 100:\n                parts.append(f\"...+{len(cells)-100}_{colour_name_str}\")\n\n        # ---- Assemble final string ----\n        result = \";\".join(parts)\n        if len(result) > 1900:\n            # Truncate but preserve most important parts (first few)\n            result = result[:1900] + \"...\"\n\n        return result\n\n    except Exceptio se:\n  * The agent is fixed at (0,0) and does not move.\n  * Lightblue cells drift downward: each noop increases each lightblue cell\u2019s row by 1 (columns unchanged), except cells already at row 15 (the bottom) which do not drift further.\n  * The down action also causes the lightblue cells to drift downward (same rule), and additionally spawns a new lightblue cell at (1,6) (row 1, column 6). This spawned cell then drifts normally.\n  * Overlap removal among lightblue cells: if a drift would cause two lightblue cells to occupy the same cell, the cell that drifted into that cell is removed. (Cells exiting the bottom of the grid are removed.)\n  * The click action reverts to the gold phase: all lightblue cells are removed; the static_gold cells reappear at their original positions (the set of static_gold before the switch); the moving_gray cells return to the positions they had just before the previous gold-phase click (i.e., the shift applied when entering lightblue is undone); the agent is placed at the current row and column of the lightblue cell that originated from the first static_gold cell (always the lightblue cell that started at (8,5)). That cell\u2019s drift history determines its position.\n- Throughout both phases, cells of the same type never overlap: whenever a movement (shift, drift, teleport, spawn) would cause an overlap, exactly one of the conflicting cells is removed according to a fixed per-cycle rule (learnable from data). The only exception is the gold cell at (1,1), which is never removed by horizontal shifts.\n- The teleport column mapping in gold phase (from down on special rows) is deterministic and consistent across episodes but not simply arithmetic; the predictor must infer it from observed transitions."}},

se teleport: rows 4,8,12,16 \u2192 row 1, column = row/4 + 3\n        teleport_str = \"\"\n        if phase == \"gold\":\n            teleport_rows = [4, 8, 12, 16]\n            mappings = []\n            for r in teleport_rows:\n                if r < h:  # only if row exists\n                    col = r // 4 + 3\n                    mappings.append(f\"r{r}->1,{col}\")\n            if mappings:\n                teleport_str = \";\".join(mappings)\n\n        # ---- Click target (lightblue cell with smallest row) ----\n        click_target = \"\"\n        if phase == \"lightblue\":\n            lightblue_cells = [(r, c) for r in range(h) for c in range(w) if grid[r][c] == 8]\n            if lightblue_cells:\n                # smallest row, then smallest column\n                lightblue_cells.sort()\n                click_target = f\"{lightblue_cells[0][0]},{lightblue_cells[0][1]}\"\n\n        # ---- Build output string ----\n        parts = [\n            f\"step:{step}\",\n            f\"ac:{action_count}\",\n            f\"phase:{phase}\",\n            f\"agent:{agent_row},{agent_col}\"\n        ]\n        if on_gold:\n            parts.append(\"ongold\")\n\n        # cell list\n        parts.append(f\"cells:{cells_str}\")\n\n        # teleport mapping (if any)\n        if teleport_str:\n            parts.append(f\"teleport:{teleport_str}\")\n\n        # click target (if lightblue phase)\n        if click_target:\n            parts.append(f\"click_target:{click_target}\")\n\n        result = \";\".join(parts)\n        if len(result) > 1900:\n            result = result[:1900] + \"...\"\n\n        return result\n\n    except Exception:\n        # never raise, never empty\n        return \"state:error\"", "world_knowledge": "world knowledge\n- The environment has two phases: gold and lightblue.\n\n- Gold phase:\n  * The agent automatically drifts downward by 1 row each step (row increases by 1), unless it occupies a static_gold cell. If on a static_gold cell, drift is suppressed \u2013 the agent\u2019s row does not change.\n  * The actions `up` and `noop` are indistinguishable; both apply the drift rule and have no other effect.\n  * Horizontal actions (`left`, `right`) do **not** move the agent. Instead, they shift all moving_gray cells: `left` decreases each moving_gray cell\u2019s column by 1; `right` increases it by 1.\n    - Static_gold cells are immovable (fixed positions), except that if a moving_gray cell shifts onto a static_gold cell, that static_gold cell is **removed**. The gold cell at (1,1) is never removed.\n    - If a shifted moving_gray cell would occupy the same cell as another moving_gray cell, the shifting cell is removed. If a shifted cell exits the grid (column < 0 or > max column), it is removed.\n    - Drift (row+1) **always** applies after a horizontal action, unless the agent is on a gold cell.\n  * The `down` action:\n    - If the agent\u2019s current row (before drift) is one of the special rows {0, 4, 8, 12, 14, 15}, a teleport occurs: the agent jumps to row 1 and a deterministic column that depends only on the starting row. The observed mapping is:\n        row 0 \u2192 col 4\n        row 4 \u2192 col 4\n        row 8 \u2192 col 5\n        row 14 \u2192 col 4\n        row 15 \u2192 col 1\n      (The column for row 12 has not been observed yet; it remains to be inferred.)\n    - This teleport replaces the normal drift. If the destination cell is occupied by a static_gold cell, that gold cell is removed.\n    - Otherwise, `down` behaves exactly like `noop` (drift applies).\n  * The `click` action switches to the lightblue phase: agent teleports to (0,0); all static_gold cells become static_gray at the same positions; all moving_gray cells become static_gray at the same positions (no shift); a fixed set of moving_lightblue cells appears at (8,5), (14,3), (15,4), (15,5).\n\n- Lightblue phase:\n  * The agent is fixed at (0,0) and does not move.\n  * Every `noop` (and also `down`) causes each moving_lightblue cell to drift downward by 1 row (columns unchanged), except cells already at row 15 (bottom) which do not drift further.\n  * `down` additionally spawns a new moving_lightblue cell at (1,6). This spawned cell then drifts normally.\n  * Overlap among lightblue cells: if a drift would cause a lightblue cell to move into a cell already occupied by another lightblue cell, the moving cell is removed. Cells exiting the bottom (row 16) are removed.\n  * The `click` action reverts to the gold phase: all moving_lightblue cells are removed; static_gold cells reappear at their original positions (the set of static_gold before the switch); moving_gray cells are restored to the positions they had just before the previous gold\u2011phase click (i.e., the shift applied when entering lightblue is undone). The agent is placed at the position of the moving_lightblue cell with the **smallest row index** (closest to top). If multiple, the one with the smallest column index is used.\n\n- Throughout both phases, cells of the same type never overlap; the removal rules above ensure this.\n- When listing cells, output them in row\u2011major order (sorted by row, then column) to ensure consistent ordering."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.15)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.35)", fillcolor=lightgray, tooltip=" "];

    14 -> 17;
    16 -> 18;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
