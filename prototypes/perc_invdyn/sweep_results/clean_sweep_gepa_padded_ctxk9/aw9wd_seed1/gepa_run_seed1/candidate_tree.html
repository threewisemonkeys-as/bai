{"idx": 3, "score": 0.925, "parents": "2", "role": "", "components": {"perception": "import json\nimport ast\nfrom collections import Counter\nfrom typing import List, Tuple, Union\n\ndef perceive(observation_history: list[str]) -> str:\n    \"\"\"\n    Parse the current raw observation and return a concise text summary\n    that distinguishes consecutive states and makes the action recoverable.\n\n    The summary includes:\n      - background colour (most frequent cell)\n      - trail colour (most frequent non\u2011background colour)\n      - list of heads: (row,col):colour:direction(s)\n      - list of clickable boundary cells: (row,col):direction(s)\n      - list of all trail cells (row,col)\n\n    Supports both ARC integer grids and Autumn JSON colour\u2011name grids.\n    \"\"\"\n    try:\n        obs = observation_history[-1]\n    except IndexError:\n        return \"empty_history\"\n\n    # ---- attempt to detect and parse Autumn (JSON) format ----\n    grid = None\n    start_idx = obs.find(\"[[\")\n    end_idx = obs.rfind(\"]]\")\n    if start_idx != -1 and end_idx != -1 and end_idx > start_idx:\n        try:\n            parsed = json.loads(obs[start_idx:end_idx+2])\n            if isinstance(parsed, list) and len(parsed) > 0 and isinstance(parsed[0], list):\n                grid = parsed\n        except (json.JSONDecodeError, ValueError):\n            pass\n\n    # ---- if not JSON, try ARC integer grid ----\n    if grid is None:\n        rows = []\n        for line in obs.splitlines():\n            line = line.strip()\n            if line.startswith('[') and line.endswith(']'):\n                try:\n                    row = ast.literal_eval(line)\n                    if isinstance(row, list) and all(isinstance(x, int) for x in row):\n                        rows.append(row)\n                except (ValueError, SyntaxError, MemoryError):\n                    continue\n        if rows and len(set(len(r) for r in rows)) == 1:\n            grid = rows\n\n    if grid is None:\n        return \"grid_not_found\"\n\n    # ---- flatten and find background (most frequent) ----\n    flat = [cell for row in grid for cell in row]\n    if not flat:\n        return \"empty_grid\"\n    background = Counter(flat).most_common(1)[0][0]\n\n    # ---- collect non\u2011background cells ----\n    non_bg = [(r, c, grid[r][c]) for r in range(len(grid)) for c in range(len(grid[0])) if grid[r][c] != background]\n\n    if not non_bg:\n        return \"all_background\"\n\n    # ---- determine trail colour (most common non\u2011background) ----\n    non_bg_colours = Counter(v for _,_,v in non_bg)\n    trail_colour = non_bg_colours.most_common(1)[0][0]\n\n    # ---- separate heads (non\u2011trail colours) and trail cells ----\n    heads = []   # (r, c, colour)\n    trail = []   # (r, c)\n    for r, c, val in non_bg:\n        if val == trail_colour:\n            trail.append((r, c))\n        else:\n            heads.append((r, c, val))\n\n    # ---- helper to get neighbour directions that are background ----\n    def outward_dirs(r, c):\n        dirs = []\n        for dr, dc, name in [(-1,0,'up'), (1,0,'down'), (0,-1,'left'), (0,1,'right')]:\n            nr, nc = r+dr, c+dc\n            if 0 <= nr < len(grid) and 0 <= nc < len(grid[0]) and grid[nr][nc] == background:\n                dirs.append(name)\n        return dirs\n\n    # ---- build head strings ----\n    head_parts = []\n    for r, c, col in heads:\n        dirs = outward_dirs(r, c)\n        dir_str = ','.join(dirs) if dirs else 'none'\n        # represent colour compactly: use string name if possible, else integer\n        col_str = str(col)\n        head_parts.append(f\"({r},{c}):{col_str}:{dir_str}\")\n\n    # ---- build clickable boundary strings ----\n    clickable_parts = []\n    for r, c in trail:\n        dirs = outward_dirs(r, c)\n        if dirs:\n            dir_str = ','.join(dirs)\n            clickable_parts.append(f\"({r},{c}):{dir_str}\")\n\n    # ---- build trail strings ----\n    trail_parts = [f\"({r},{c})\" for r, c in trail]\n\n    # ---- assemble final summary ----\n    bg_str = str(background)\n    trail_col_str = str(trail_colour)\n\n    head_section = \"heads: \" + (\"; \".join(head_parts) if head_parts else \"none\")\n    clickable_section = \"clickable: \" + (\"; \".join(clickable_parts) if clickable_parts else \"none\")\n    trail_section = \"trail: \" + (\"; \".join(trail_parts) if trail_parts else \"none\")\n    meta = f\"bg {bg_str} trail {trail_col_str}\"\n\n    summary = f\"{meta} | {head_section} | {clickable_section} | {trail_section}\"\n\n    # ---- enforce length limit (2000 chars) ----\n    if len(summary) > 1990:\n        # shorten trail section first (it's usually the longest)\n        max_trail_len = 1990 - (len(summary) - len(trail_section)) - 30\n        if max_trail_len > 20 and len(trail_parts) > 5:\n            keep = []\n            total = 0\n            for p in trail_parts:\n                if total + len(p) + 2 > max_trail_len:\n                    break\n                keep.append(p)\n                total += len(p) + 2\n            shortened_trail = \"; \".join(keep) + f\" ...(+{len(trail_parts)-len(keep)} cells)\"\n            summary = f\"{meta} | {head_section} | {clickable_section} | trail: {shortened_trail}\"\n        # if still too long, hard cut\n        if len(summary) > 1995:\n            summary = summary[:1995] + \"...\"\n\n    return summary", "world_knowledge": "world knowledge\n- The grid consists of cells with colors: tan, yellow, orange, or empty (unlisted).\n- Actions: up, down, left, right (move the agent? not used in examples), noop, click ROW COL.\n- A click action (whether on a tan cell or an empty cell) does **not** change the state in the immediately following frame. The next state is identical to the current state.\n- The effect of clicking a tan cell appears only after one or more subsequent noop steps: a new moving head emerges from the clicked cell. Clicking an empty {"idx": 9, "score": 0.925, "parents": "2", "role": "", "components": {"perception": "import json\nimport ast\nimport re\nfrom collections import Counter\nfrom typing import List, Tuple, Optional\n\ndef perceive(observation_history: list[str]) -> str:\n    \"\"\"\n    Parse the current raw observation (last element of history) and return a concise\n    text summary of decision\u2011relevant features. The output must be non\u2011empty, never\n    raise exceptions, and change between consecutive states if the world moves.\n\n    Supports two encodings:\n      (A) ARC integer grid \u2013 rows as bracketed comma\u2011separated ints after a marker.\n      (B) Autumn string grid \u2013 a single JSON 2\u2011D array of colour names.\n\n    Additionally, extracts step number and action count from the metadata (common\n    to both formats) so that consecutive states always differ even when the grid\n    appears unchanged.\n    \"\"\"\n    try:\n        obs = observation_history[-1]\n    except IndexError:\n        return \"empty_history\"\n\n    # ------------------- Parse metadata (step, action count) -------------------\n    step = None\n    actcnt = None\n    step_match = re.search(r\"Step:\\s*(\\d+)\", obs)\n    if step_match:\n        step = int(step_match.group(1))\n    actcnt_match = re.search(r\"Action count:\\s*(\\d+)\", obs)\n    if actcnt_match:\n        actcnt = int(actcnt_match.group(1))\n\n    # ------------------- Parse the grid (try JSON first, then ARC int) --------\n    grid = None\n\n    # Try Autumn (JSON) format: locate outermost [[ ... ]]\n    start_idx = obs.find(\"[[\")\n    end_idx = obs.rfind(\"]]\")\n    if start_idx != -1 and end_idx != -1 and end_idx > start_idx:\n        try:\n            parsed = json.loads(obs[start_idx:end_idx+2])\n            if isinstance(parsed, list) and len(parsed) > 0 and isinstance(parsed[0], list):\n                grid = parsed\n        except (json.JSONDecodeError, ValueError):\n            pass\n\n    # Fallback: ARC e\"\n\n    if len(summary) > 1990:\n        # Truncate with an overflow count\n        truncated = summary[:1980] + f\"... (+{len(non_bg)-5} cells)\" if non_bg else summary[:1980] + \"...\"\n        if len(truncated) < 2000:\n            return truncated\n        else:\n            return summary[:1995] + \"...\"\n\n    return summary", "world_knowledge": "world knowledge\n- The grid consists of cells with colors: tan, yellow, orange, or empty (unlisted).\n- Actions: up, down, left, right (move the agent? not used in examples), noop, click ROW COL.\n- A click action (whether on a tan cell or an empty cell) does **not** change the state in the immediately following frame. The next state is identical to the current state.\n- The effect of clicking a tan cell appears only after one or more subsequent noop steps: a new moving head emerges from the clicked cell. Clicking an empty cell produces no effect.\n- A noop action advances all existing moving heads one step in their preset outward direction. The head leaves its previous cell (which becomes empty) and occupies an adjacent cell (the new cell becomes tan, yellow, or orange depending on the head's type).\n- The direction of a moving head is determined when it is spawned (perpendicular to the shape's boundary at the clicked cell) and remains constant."}}];

}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
