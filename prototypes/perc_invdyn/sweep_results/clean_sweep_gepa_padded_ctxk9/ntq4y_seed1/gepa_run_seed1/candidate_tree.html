                      rows.append(row)\n                    except Exception:\n                        # skip malformed rows\n                        continue\n                else:\n                    # assume end of grid block\n                    break\n            if rows:\n                grid = rows\n\n    # If both approaches failed, return a best\u2011effort empty representation\n    if grid is None:\n        return \"[]\"\n\n    # Determine background colour (most frequent)\n    flat = [cell for row in grid for cell in row]\n    if not flat:\n        return \"[]\"\n    background = collections.Counter(flat).most_common(1)[0][0]\n\n    # Collect all non\u2011background cells\n    features = []\n    for r, row in enumerate(grid):\n        for c, col in enumerate(row):\n            if col != background:\n                # For integer grids, keep the integer; for string grids, keep the name\n                features.append((r, c, col))\n\n    if not features:\n        return \"[]\"\n\n    # Build concise summary. Example: \"bg=black; (0,2,purple),(0,5,orange),...\"\n    # Ensure total length < 2000 (very likely with a few cells)\n    bg_str = str(background)\n    cells_str = \"\".join(f\"({r},{c},{col}),\" for r, c, col in features)\n    # Remove trailing comma\n    cells_str = cells_str.rstrip(\",\")\n    return f\"bg={bg_str}; {cells_str}\"", "world_knowledge": ""}},

{"idx": 4, "score": 0.75, "parents": "2", "role": "", "components": {"perception": "import json\nimport collections\n\ndef perceive(observation_history: list[str]) -> str:\n    \"\"\"\n    Extract a concise summary of decision\u2011relevant features from the grid\n    observation.  The summary includes:\n      - step number\n      - background colour (most frequent)\n      - sorted list of all non\u2011background cells (row, col, colour)\n      - the palette (top\u2011row colours per column)\n      - active colour: the colour that would be placed on the next click\n        (inferred from the most recent non\u2011top\u2011row block placement in history)\n\n    The output is deterministic: cells are sorted by row then column.\n    The active_colour feature changes even when the grid does not,\n    helping disambiguate inert top\u2011row clicks from no\u2011ops.\n\n    Never raises, never returns an empty string.\n    \"\"\"\n    obs = observation_history[-1]\n\n    # ---- extract step number ----\n    step = None\n    for line in obs.splitlines():\n        stripped = line.strip()\n        if stripped.startswith(\"Step:\"):\n            try:\n                step = int(stripped.split(\":\")[1].strip())\n            except ValueError:\n                pass\n            break\n\n    # ---- parse grid (any encoding) ----\n    grid = None\n\n    # (A) try JSON (autumn style)\n    idx = obs.find(\"[[\")\n    if idx != -1:\n        end = obs.rfind(\"]]\")\n        if end != -1 and end > idx:\n            try:\n                grid = json.loads(obs[idx:end+2])\n                if not isinstance(grid, list) or not all(isinstance(r, list) for r in grid):\n                    grid = None\n            except json.JSONDecodeError:\n                grid = None\n\n    # (B) fallback to ARC integer grid\n    if grid is None:\n        marker = \"<grid_\"\n        marker_idx = obs.find(marker)\n        if marker_idx != -1:\n            lines = obs.splitlines()\n            start_parsing = False\n            rows = []\n            for line in lines:\n                if not start_parsing:\n                    if line.strip().startswith(marker):\n                        start_parsing = True\n                    continue\n                line = line.strip()\n                if line.startswith('[') and line.endswith(']'):\n                    try:\n                        inner = line[1:-1]\n                        row = [int(x.strip()) for x in inner.split(',') if x.strip()]\n                        rows.append(row)\n                    except ValueError:\n                        continue\n                else:\n                    break\n            if rows:\n                grid = rows\n\n    # if no grid was parsed, return a minimal summary\n    if grid is None:\n        return f\"step={step}; []\" if step is not None else \"[]\"\n\n    # flatten and determine background\n    flat = [cell for row in grid for cell in row]\n    if not flat:\n        return f\"step={step}; []\" if step is not None else \"[]\"\n\n    background = collections.Counter(flat).most_common(1)[0][0]\n\n    # ---- build non\u2011background cell list (sorted) ----\n    cells = []\n    palette = {}            # col -> colour for the top row (row=0)\n    for r, row in enumerate(grid):\n        for c, col in enumerate(row):\n            if col == background:\n                continue\n            cells.append((r, c, col))\n            if r == 0:\n                palette[c] = col\n\n    cells.sort(key=lambda x: (x[0], x[1]))   # stable sort by row then col\n\n    # ---- infer active colour from history ----\n    active_colour = None           # default unknown\n    # Walk the whole history back to find the most recent placement of a non\u2011top\u2011row block.\n    # A placement is the first appearance of a cell whose colour is not background\n    # and whose row is not 0.\n    # We compare consecutive observations in reverse order.\n    if len(observation_history) >= 2:\n        prev_grids = []\n        # parse all previous observations as best we can\n        for prev_obs in observation_history[:-1]:\n            g = None\n            idx2 = prev_obs.find(\"[[\")\n            if idx2 != -1:\n                end2 = prev_obs.rfind(\"]]\")\n                if end2 != -1 and end2 > idx2:\n                    try:\n                        g = json.loads(prev_obs[idx2:end2+2])\n                        if not isinstance(g, list) or not all(isinstance(r, list) for r in g):\n                            g = None\n                    except json.JSONDecodeError:\n                        g = None\n            if g is None:\n                m = prev_obs.find(\"<grid_\")\n                if m != -1:\n                    lines2 = prev_obs.splitlines()\n                    start = False\n                    rows2 = []\n                    for l in lines2:\n                        if not start:\n                            if l.strip().startswith(\"<grid_\"):\n                                start = True\n                            continue\n                        l = l.strip()\n                        if l.startswith('[') and l.endswith(']'):\n                            try:\n                                inner = l[1:-1]\n                                row2 = [int(x.strip()) for x in inner.split(',') if x.strip()]\n                                rows2.append(row2)\n                            except ValueError:\n                                continue\n                        else:\n                            break\n                    if rows2:\n                        g = rows2\n            if g is not None:\n                prev_grids.append(g)\n            else:\n                prev_grids.append(None)\n\n        # iterate from the most recent previous observation backwards\n        for idx2 in range(len(prev_grids)-1, -1, -1):\n            g = prev_grids[idx2]\n            if g is None:\n                continue\n            # compute non\u2011background cells of this previous grid\n            prev_cells = []\n            for r, row in enumerate(g):\n                for c, col in enumerate(row):\n                    if col != background and r != 0:\n                        prev_cells.append((r, c, col))\n            # compute non\u2011background cells of the current grid\n            curr_cells = [(r, c, col) for (r, c, col) in cells if r != 0]\n            # new cells are those in curr but not in prev\n            prev_set = set(prev_cells)\n            curr_set = set(curr_cells)\n            new_cells = curr_set - prev_set\n            if new_cells:\n                # take the colour of the first new cell (should all be same)\n                for (r, c, col) in new_cells:\n                    active_colour = col\n                    break\n                break   # found most recent placement\n\n    # ---- build summary string ----\n    step_str = f\"step={step}; \" if step is not None else \"\"\n    bg_str = f\"bg={background}; \"\n    palette_str = f\"palette={{{', '.join(f'{c}:{palette[c]}' for c in sorted(palette))}}}; \" if palette else \"\"\n    active_str = f\"active={active_colour}; \" if active_colour is not None else \"active=None; \"\n    cells_str = \",\".join(f\"({r},{c},{col})\" for (r, c, col) in cells)\n\n    if not cells_str:\n        # no non\u2011background cells: still include metadata\n        return f\"{step_str}{bg_str}{palette_str}{active_str}[]\"\n\n    return f\"{step_str}{bg_str}{palette_str}{active_str}{cells_str}\"", "world_knowledge": ""}},

{"idx": 18, "score": 0.925, "parents": "12", "role": "", "components": {"perception": "import json\nimport collections\nimport re\n\n# ----------------------------------------------------------------------\n# colour-name mapping for ARC integer grids (0\u201111)\n_ARC_PALETTE = {\n    0: \"black\", 1: \"blue\", 2: \"red\", 3: \"green\", 4: \"yellow\",\n    5: \"light-gray\", 6: \"magenta\", 7: \"orange\", 8: \"light-blue\",\n    9: \"maroon\", 10: \"white\", 11: \"dark-gray\"\n}\n\n# set of all colour names that can appear (both ARC and autumn variants)\n_KNOWN_COLOURS = {\n    \"black\", \"blue\", \"red\", \"green\", \"yellow\", \"light-gray\", \"magenta\",\n    \"orange\", \"light-blue\", \"maroon\", \"white\", \"dark-gray\",\n    \"purple\", \"gray\", \"gold\", \"lightblue\", \"darkgreen\"\n}\n\n# positions (column indices) of the special control cells in row 0\n_TOP_COLS = [2, 5, 8, 11, 14]\n\n# expected colour at each control column and its functional role tag\n_TOP_ROLE = {\n    2: \"purple-shift\",\n    5: \"orange-shift\",\n    8: \"blue-set\",\n    11: \"gray-delete\",\n    14: \"red-reset\"\n}\n# ----------------------------------------------------------------------\n\n\ndef _find_active_colour(obs: str) -> str | None:\n    \"\"\"Search the observation text for the current active colour.\"\"\"\n    for line in obs.splitlines():\n        stripped = line.strip().lower()\n        # look for any line that mentions colour/color/selected/tool\n        if not any(pat in stripped for pat in\n                   [\"active color\", \"active colour\", \"selected colour\",\n                    \"selected color\", \"current colour\", \"current color\",\n                    \"colour:\", \"color:\", \"paint colour\", \"paint color\"]):\n            continue\n        # extract text after the last colon\n        parts = stripped.rsplit(\":\", 1)\n        if len(parts) < 2:\n            continue\n        cand = parts[-1].strip().rstrip('.').lstrip()\n        if cand in _KNOWN_COLOURS:\n            return cand\n    return None\n\n\ndef _cell_name(val):\n    \"\"\"Convert an ARC integer to a colour name; return string for autumn grids.\"\"\"\n    if isinstance(val, int):\n        return _ARC_PALETTE.get(val, \"unknown\")\n    return val\n\n\ndef _count_and_background(grid):\n    \"\"\"Return (flattened list, background colour name).\"\"\"\n    flat = []\n    for row in grid:\n        flat.extend(_cell_name(c) for c in row)\n    if not flat:\n        return flat, \"black\"\n    cnt = collections.Counter(flat)\n    return flat, cnt.most_common(1)[0][0]\n\n\ndef perceive(observation_history: list[str]) -> str:\n    obs = observation_history[-1]\n\n    # ------------- step -------------\n    step = None\n    for line in obs.splitlines():\n        s = line.strip()\n        if s.startswith(\"Step:\"):\n            try:\n                step = int(s.split(\":\")[1].strip())\n            except Exception:\n                pass\n            break\n\n    # ------------- active colour -------------\n    active = _find_active_colour(obs)\n\n    # ------------- parse grid -------------\n    grid = None\n    # try autumn JSON encoding\n    idx = obs.find(\"[[\")\n    if idx != -1:\n        end = obs.rfind(\"]]\")\n        if end != -1 and end > idx:\n            try:\n                raw = obs[idx:end+2]\n                parsed = json.loads(raw)\n                if isinstance(parsed, list) and len(parsed) > 0 and isinstance(parsed[0], list):\n                    grid = parsed\n            except Exception:\n                pass\n\n    # fallback to ARC integer encoding\n    if grid is None:\n        marker = \"<grid_\"\n        marker_idx = obs.find(marker)\n        if marker_idx != -1:\n            lines = obs.splitlines()\n            rows = []\n            parsing = False\n            for line in lines:\n                if not parsing:\n                    if line.strip().startswith(marker):\n                        parsing = True\n                    continue\n                line = line.strip()\n                if line.startswith('[') and line.endswith(']'):\n                    try:\n                        inner = line[1:-1]\n                        row = [int(x.strip()) for x in inner.split(',') if x.strip()]\n                        rows.append(row)\n                    except Exception:\n                        continue\n                else:\n                    break\n            if rows and len(rows[0]) > 0:\n                grid = rows\n\n    # if no grid parsed, return minimal summary\n    if grid is None:\n        parts = []\n        if step is not None:\n            parts.append(f\"step={step}\")\n        if active:\n            parts.append(f\"active={active}\")\n        parts.append(\"grid=null\")\n        return \"; \".join(parts)\n\n    # dimensions\n    height = len(grid)\n    width = len(grid[0]) if height > 0 else 0\n\n    # background colour\n    flat, bg = _count_and_background(grid)\n\n    # ------------- top row control cells -------------\n    top_parts = []\n    for col in _TOP_COLS:\n        if col < width:\n            colour = _cell_name(grid[0][col])\n            role = _TOP_ROLE.get(col, \"?\")\n            # only include if the colour matches the expected one\n            if colour in _KNOWN_COLOURS:\n                top_parts.append(f\"{col}{colour}-{role}\")\n    if top_parts:\n        top_str = \"[\" + \",\".join(top_parts) + \"]\"\n    else:\n        top_str = \"[]\"\n\n    # ------------- orange in rows 1..15 -------------\n    non_top_orange = False\n    for r in range(1, height):\n        for c in range(width):\n            colour = _cell_name(grid[r][c])\n            if colour == \"orange\":\n                non_top_orange = True\n                break\n        if non_top_orange:\n            break\n\n    # ------------- non\u2011background, non\u2011top cells -------------\n    features = []\n    for r in range(1, height):          # skip row 0\n        for c in range const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.25)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.60)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.60)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.60)", fillcolor=lightgray, tooltip=" "];
    4 [label="4\\n(0.75)", fillcolor=lightgray, tooltip=" "];
    5 [label="5\\n(0.65)", fillcolor=lightgray, tooltip=" "];
    6 [label="6\\n(0.70)", fillcolor=lightgray, tooltip=" "];
    7 [label="7\\n(0.68)", fillcolor=lightgray, tooltip=" "];
    8 [label="8\\n(0.85)", fillcolor=lightgray, tooltip=" "];
    9 [label="9\\n(0.90)", fillcolor=lightgray, tooltip=" "];
    10 [label="10\\n(0.90)", fillcolor=lightgray, tooltip=" "];
    11 [label="11\\n(0.90)", fillcolor=lightgray, tooltip=" "];
    12 [label="12\\n(0.90)", fillcolor=orange, tooltip=" "];
    13 [label="13\\n(0.93)", fillcolor=lightgray, tooltip=" "];
    14 [label="14\\n(0.95)", fillcolor=cyan, tooltip=" "];
    15 [label="15\\n(0.95)", fillcolor=lightgray, tooltip=" "];
    16 [label="16\\n(0.90)", fillcolor=lightgray, tooltip=" "];
    17 [label="17\\n(0.95)", fillcolor=orange, tooltip=" "];
    18 [label="18\\n(0.93)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    1 -> 2;
    1 -> 3;
    2 -> 4;
    2 -> 5;
    2 -> 6;
    5 -> 7;
    6 -> 8;
    8 -> 9;
    9 -> 10;
    9 -> 11;
    11 -> 12;
    12 -> 13;
    13 -> 14;
    12 -> 15;
    12 -> 16;
    12 -> 17;
    12 -> 18;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
