ould not be parsed.\"\n\n        rows = len(grid)\n        cols = len(grid[0]) if rows > 0 else 0\n\n        # 3. background\n        bg = _most_frequent_color(grid)\n\n        # 4. collect non\u2011background cells and autonomous agents\n        non_bg_cells = []\n        grays = []                # (r, c, direction, source_spawn)\n        for r in range(rows):\n            for c in range(cols):\n                col = grid[r][c]\n                if col != bg:\n                    non_bg_cells.append((r, c, col))\n                    if col == \"gray\":\n                        # determine direction and source spawn from domain\n                        if r == 10 and c < 10:\n                            direction = \"east\"\n                            source = \"spawn10\"\n                        elif c == 10 and r < 3:\n                            direction = \"south\"\n                            source = \"spawn0\"\n                        elif c == 10 and r > 7:\n                            direction = \"north\"\n                            source = \"spawn10\"\n                        elif r == 0 and c < 10:\n                            direction = \"east\"\n                            source = \"spawn0\"\n                        else:\n                            direction = \"unknown\"\n                            source = \"unknown\"\n                        grays.append((r, c, direction, source))\n\n        # sort for determinism\n        non_bg_cells.sort(key=lambda x: (x[0], x[1]))\n        grays.sort()\n\n        # 5. column\u201110 pattern (rows 3\u20117)\n        col10_cells = []\n        for r in range(3, 8):\n            if cols > 10:\n                col10_cells.append(grid[r][10])\n        pattern_state = _pattern_state(col10_cells)\n        next_auto = _next_auto_change(step)\n\n        # 6. spawn readiness\n        spawn_10_ready = True\n        for r, c, _, _ in grays:\n            if (r == 10 and c < 10) or (c == 10 and r > 6):\n nue until they reach bottom-left spawn area and vanish), the spawn that produced it returns to \"ready\" state, and no autonomous object remains.\n\nClicking a spawn at (0,0) or (10,0) while it is \"ready\":\n- Activates that spawn (changes to \"active\") and spawns a new gray autonomous object at the spawn cell.\n- The autonomous object's initial direction and next cell:\n  - Spawn(0,0): object at (0,0) dir=east next=(0,1) [but note (0,0) is blue immutable; object appears adjacent at (0,1) dir=east? from examples: after clicking (0,0) when ready, next state shows spawn active and gray at (0,1) dir=east next=(0,2)].\n  - Spawn(10,0): object at (10,0) dir=east next=(10,1) [similarly, object at (10,1) dir=east].\n- Clicking a spawn that is \"active\" has no effect (remains active with the object already moving).\n\nClicking on column 10 cells (pattern area) toggles pattern:\n- Clicking the gold cell (row5,col10) in pattern B toggles pattern to A and updates column 10 colors to pattern A's set.\n- Clicking any of pattern A's yellow or white cells at col10 toggles pattern to B and updates column 10 colors to pattern B's set.\n- Clicking elsewhere on col10 that is not the pattern's key cell triggers pattern toggle as well (based on pattern, not on exact cell).\n- After manual toggle via click, pattern auto-change step counter resets? (from examples: after manual toggle pattern at step 45\u219246, pattern auto-change at step 60 for the new pattern).\n\nnoop action: all autonomous objects move one step in their direction (with boundary turning), pattern auto-change timer advances (if timer reaches scheduled step, pattern toggles automatically), spawn states remain unchanged (active spawns stay active, ready spawns stay ready). No other state changes.\n\nup/down/left/right actions have no effect on state (agent movement not relevant in this environment)."}},

        #   (0,0) spawn: active if a gray is on row0 or on col10 with r<3\n        spawn_0_ready = True\n        for r, c, _ in grays:\n            if (r == 0 and c < 10) or (c == 10 and r < 3):\n                spawn_0_ready = False\n                break\n\n        # 7. immutable cells (domain\u2011specific)\n        immutables = []\n        if rows > 0 and cols > 0 and grid[0][0] == \"blue\":\n            immutables.append((0,0))\n        if rows > 10 and cols > 0 and grid[10][0] == \"red\":\n            immutables.append((10,0))\n\n        # 8. build output\n        parts = [f\"Step {step}. Grid {rows}x{cols}. Background: {bg}.\"]\n\n        # immutable\n        if immutables:\n            imm_str = \"; \".join(f\"({r},{c})\" for r,c in immutables)\n            parts.append(f\"Immutable: {imm_str}.\")\n\n        # spawn points with readiness\n        parts.append(f\"Spawn(0,0): {'ready' if spawn_0_ready else 'active'}.\")\n        parts.append(f\"Spawn(10,0): {'ready' if spawn_10_ready else 'active'}.\")\n\n        # autonomous agents with direction\n        if grays:\n            gray_str = \"; \".join(f\"({r},{c}) dir={d}\" for r,c,d in grays)\n            parts.append(f\"Autonomous: gray at [{gray_str}].\")\n        else:\n            parts.append(\"Autonomous: none.\")\n\n        # pattern phase\n        parts.append(f\"Pattern: {pattern_state} (auto-change at step {next_auto}).\")\n\n        # column10 detail\n        col10_desc = \", \".join(f\"row{r}={grid[r][10]}\" for r in range(3,8) if cols>10)\n        if col10_desc:\n            parts.append(f\"Col10: [{col10_desc}].\")\n\n        # non\u2011background cells (limit to 50)\n        limit = 50\n        if len(non_bg_cells) > limit:\n            displayed = non_bg_cells[:limit]\n            ellipsis = \" ...\"\n        else:\n            displayed = non_bg_cells\n            ellipsis = \"\"\n        cell_str = \"; \".join(f\"({r},{c})={col}\" for r,c,col in displayed)\n        if cell_str:\n            parts.append(f\"Non-bg: {cell_str}{ellipsis}.\")\n        else:\n            parts.append(\"Non-bg: all background.\")\n\n        output = \" \".join(parts)\n\n        # ensure <2000 chars\n        if len(output) > 1950:\n            # reduce non\u2011bg cells further\n            max_cells = 40\n            displayed = non_bg_cells[:max_cells]\n            cell_str = \"; \".join(f\"({r},{c})={col}\" for r,c,col in displayed)\n            parts[-1] = f\"Non-bg: {cell_str}...\"\n            output = \" \".join(parts)\n            if len(output) > 1990:\n                # drop col10 detail if needed\n                parts = [p for p in parts if not p.startswith(\"Col10:\")]\n                output = \" \".join(parts)\n\n        return output\n\n    except Exception:\n        # never raise, never return empty\n        return fallback", "world_knowledge": "- The environment is an 11x11 grid with a black background. Cells (0,0) (blue) and (10,0) (red) are immutable.\n- Two \"Spawn\" points exist: Spawn(0,0) and Spawn(10,0). Their status can be \"ready\" or \"active\". When Spawn(10,0) is \"active\", it produces an autonomous gray agent at (10,1) moving east on the next timestep (the gray appears the step after it becomes active). Spawn(0,0) similarly produces a gray agent at (0,1) when active (observed from pattern symmetry). The spawn status changes from \"active\" to \"ready\" one timestep after the agent appears.\n- Autonomous gray agents move one cell per timestep in their current direction (east, south, north). The agent moves automatically on every timestep regardless of the action taken (even if noop). When the agent reaches a grid boundary (e.g., row 10, column 10), it automatically changes direction: at the right edge (col 10) it turns north; at the bottom edge (row 10) it turns east; at the top edge (row 0, col 10) it disappears (the agent is removed from the grid and spawns become ready). The agent does NOT require a click to move or disappear.\n- There is a pattern system: the grid displays \"Pattern: A\" or \"Pattern: B\" with a note like \"auto-change at step N\". When the step counter reaches this N, the pattern automatically changes (A\u2192B or B\u2192A) on that timestep, and all cells in column 10 (rows 3-7) update to the new pattern's color set simultaneously. The pattern's identity and color mapping:\n  - Pattern A: row3=white, row4=yellow, row5=yellow, row6=yellow, row7=white.\n  - Pattern B: row3=yellow, row4=white, row5=gold, row6=white, row7=yellow.\n- Clicking a non-immutable, non-agent cell in column 10 (rows 3-7) triggers an immediate pattern switch (B\u2194A) on the next timestep, updating all column 10 colors to the other pattern's colors. Clicking (10,0) (the red immutable cell) has no effect. Clicking any other cell not in column 10 has no visible effect (does not change any features).\n- The \"noop\" action keeps the state unchanged except for autonomous agent movement (if any) and scheduled auto-change at the specified step.\n- The \"click ROW COL\" action has no effect on autonomous agent movement \u2014 the agent still moves one cell per timestep regardless of clicks."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.15)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.78)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.82)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.78)", fillcolor=lightgray, tooltip=" "];
    4 [label="4\\n(0.85)", fillcolor=lightgray, tooltip=" "];
    5 [label="5\\n(0.90)", fillcolor=lightgray, tooltip=" "];
    6 [label="6\\n(0.85)", fillcolor=lightgray, tooltip=" "];
    7 [label="7\\n(0.88)", fillcolor=lightgray, tooltip=" "];
    8 [label="8\\n(0.90)", fillcolor=lightgray, tooltip=" "];
    9 [label="9\\n(0.88)", fillcolor=lightgray, tooltip=" "];
    10 [label="10\\n(0.85)", fillcolor=lightgray, tooltip=" "];
    11 [label="11\\n(0.93)", fillcolor=cyan, tooltip=" "];
    12 [label="12\\n(0.85)", fillcolor=lightgray, tooltip=" "];
    13 [label="13\\n(0.93)", fillcolor=orange, tooltip=" "];
    14 [label="14\\n(0.85)", fillcolor=lightgray, tooltip=" "];
    15 [label="15\\n(0.93)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    1 -> 3;
    2 -> 4;
    4 -> 5;
    4 -> 6;
    6 -> 7;
    5 -> 8;
    4 -> 9;
    4 -> 10;
    10 -> 11;
    4 -> 12;
    11 -> 13;
    4 -> 14;
    4 -> 15;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
