                   grid.append(row)\n                        except:\n                            continue\n                    # Stop at empty line or next marker? We'll take all such consecutive rows.\n                    elif line == '' or line.startswith('<'):\n                        break\n                # If we got at least one row, we have a grid\n                if not grid:\n                    grid = None\n\n        if grid is None or len(grid) == 0 or len(grid[0]) == 0:\n            # Fallback: no grid parsed\n            return f\"{step} (no grid)\"\n\n        # 3. Determine background colour\n        # For integer grid, background is 0 (black)\n        # For string grid, background is \"black\"\n        # We'll compute the most frequent colour as background (robust)\n        # But typical: black is overwhelmingly dominant.\n        # Instead, we can treat black/0 as background directly.\n        is_int_grid = isinstance(grid[0][0], int)\n        if is_int_grid:\n            bg_values = {0}\n            bg_name = \"0\"\n        else:\n            bg_values = {\"black\"}\n            bg_name = \"black\"\n\n        # 4. Collect all non\u2011background cells\n        non_bg: List[Tuple[int, int, Any]] = []\n        for r in range(len(grid)):\n            for c in range(len(grid[r])):\n                val = grid[r][c]\n                if is_int_grid:\n                    if val not in bg_values:\n                        non_bg.append((r, c, val))\n                else:\n                    if val not in bg_values:\n                        non_bg.append((r, c, val))\n\n        # 5. Build summary\n        if not non_bg:\n            return f\"{step} (all background)\"\n\n        # Sort for consistency (top-left first)\n        non_bg.sort(key=lambda x: (x[0], x[1]))\n\n        parts = []\n        for r, c, colour in non_bg:\n            if is_int_grid:\n                parts.append(f\"({r},{c},{colour})\")\n            else:\n                parts.append(f\" ection = max(delta_counts, key=delta_counts.get)\n        if movement_direction:\n            extra.append(f\"mv_dir:({movement_direction[0]},{movement_direction[1]})\")\n\n        # Noop streak (how many consecutive states are identical?)\n        streak = 1\n        if len(observation_history) >= 2:\n            # If current cells exactly equal previous cells (same positions, colours, count)\n            if len(prev_cells) == len(current_cells):\n                # Build sets of (r,c,col) for comparison\n                prev_set = set(prev_cells)\n                cur_set = set(current_cells)\n                if prev_set == cur_set:\n                    streak = 2\n                    for i in range(2, min(len(observation_history), 25)):\n                        earlier_raw = observation_history[-i]\n                        earlier_grid = parse_grid(earlier_raw)\n                        if earlier_grid and len(earlier_grid) > 0:\n                            earlier_cells = set(get_non_bg(earlier_grid))\n                            if earlier_cells == cur_set:\n                                streak += 1\n                            else:\n                                break\n                        else:\n                            break\n                else:\n                    streak = 1\n            else:\n                streak = 1\n        if streak > 1:\n            extra.append(f\"noop_streak:{streak}\")\n\n        # Add extra if any\n        if extra:\n            summary += \" ; \" + \" | \".join(extra)\n\n        # ---------- Ensure length <2000 ----------\n        if len(summary) > 1900:\n            # Truncate cell list, keep extra info\n            max_cells = 8\n            parts_short = parts[:max_cells]\n            summary = f\"{step} cells: {' '.join(parts_short)}\"\n            if extra:\n                # Keep only noop_streak (most important) and maybe mv_dir\n                keep = [e for e in extra if e.startswith(\"noop_streak\") or e.startswith(\"mv_dir\")]\n                if keep:\n                    summary += \" ; \" + \" | \".join(keep)\n            if len(summary) > 1900:\n                # Last resort: just count and streak\n                summary = f\"{step} {len(current_cells)} cells, streak:{streak}\"\n\n        return summary\n\n    except Exception:\n        return \"(parse error)\"", "world_knowledge": ""}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.20)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.30)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.47)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.42)", fillcolor=lightgray, tooltip=" "];
    4 [label="4\\n(0.42)", fillcolor=lightgray, tooltip=" "];
    5 [label="5\\n(0.62)", fillcolor=lightgray, tooltip=" "];
    6 [label="6\\n(0.50)", fillcolor=lightgray, tooltip=" "];
    7 [label="7\\n(0.53)", fillcolor=lightgray, tooltip=" "];
    8 [label="8\\n(0.70)", fillcolor=lightgray, tooltip=" "];
    9 [label="9\\n(0.53)", fillcolor=lightgray, tooltip=" "];
    10 [label="10\\n(0.72)", fillcolor=lightgray, tooltip=" "];
    11 [label="11\\n(0.55)", fillcolor=orange, tooltip=" "];
    12 [label="12\\n(0.55)", fillcolor=lightgray, tooltip=" "];
    13 [label="13\\n(0.82)", fillcolor=cyan, tooltip=" "];
    14 [label="14\\n(0.62)", fillcolor=orange, tooltip=" "];
    15 [label="15\\n(0.55)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    0 -> 2;
    1 -> 3;
    3 -> 4;
    3 -> 5;
    2 -> 6;
    2 -> 7;
    6 -> 8;
    7 -> 9;
    8 -> 10;
    7 -> 11;
    11 -> 12;
    10 -> 13;
    11 -> 14;
    11 -> 15;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
